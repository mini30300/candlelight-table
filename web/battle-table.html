<style>

<script>
// ===== the skeleton rig (same module as สติกแมน v4) =====
var SKRIG = (function(){
"use strict";
var D = Math.PI/180, TAU = Math.PI*2;
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function frac(x){ return x-Math.floor(x); }
function sstep(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function inOut3(t){ t=clamp(t,0,1); return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function add(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; }
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function mul(a,s){ return [a[0]*s,a[1]*s,a[2]*s]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function len(a){ return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]); }
function norm(a){ var l=len(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; }

// ---- quaternions [x,y,z,w] ----
var QI = [0,0,0,1];
function qmul(a,b){ var ax=a[0],ay=a[1],az=a[2],aw=a[3],bx=b[0],by=b[1],bz=b[2],bw=b[3];
  return [aw*bx+ax*bw+ay*bz-az*by, aw*by-ax*bz+ay*bw+az*bx, aw*bz+ax*by-ay*bx+az*bw, aw*bw-ax*bx-ay*by-az*bz]; }
function qconj(q){ return [-q[0],-q[1],-q[2],q[3]]; }
function qrot(q,v){ var x=q[0],y=q[1],z=q[2],w=q[3];
  var ux=y*v[2]-z*v[1], uy=z*v[0]-x*v[2], uz=x*v[1]-y*v[0];
  var vx=y*uz-z*uy, vy=z*ux-x*uz, vz=x*uy-y*ux;
  return [v[0]+2*(w*ux+vx), v[1]+2*(w*uy+vy), v[2]+2*(w*uz+vz)]; }
function qx(a){ return [Math.sin(a/2),0,0,Math.cos(a/2)]; }
function qy(a){ return [0,Math.sin(a/2),0,Math.cos(a/2)]; }
function qz(a){ return [0,0,Math.sin(a/2),Math.cos(a/2)]; }
// Euler in DEGREES, R = Ry(y) * Rx(x) * Rz(z). X = flex (sagittal), Y = twist/turn, Z = side bend / abduction.
function eul(x,y,z){ return qmul(qmul(qy((y||0)*D), qx((x||0)*D)), qz((z||0)*D)); }
function qnorm(q){ var l=Math.sqrt(q[0]*q[0]+q[1]*q[1]+q[2]*q[2]+q[3]*q[3])||1; return [q[0]/l,q[1]/l,q[2]/l,q[3]/l]; }
function qdot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3]; }
function qslerp(a,b,t){
  var d=qdot(a,b), bb=b; if (d<0){ d=-d; bb=[-b[0],-b[1],-b[2],-b[3]]; }
  if (d>0.9995) return qnorm([lerp(a[0],bb[0],t),lerp(a[1],bb[1],t),lerp(a[2],bb[2],t),lerp(a[3],bb[3],t)]);
  var th=Math.acos(d), s=Math.sin(th), wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s;
  return [a[0]*wa+bb[0]*wb, a[1]*wa+bb[1]*wb, a[2]*wa+bb[2]*wb, a[3]*wa+bb[3]*wb]; }
function qslerpRaw(a,b,t){   // slerp without choosing the short hemisphere (caller picks the sign of b)
  var d = clamp(qdot(a,b),-1,1);
  if (d > 0.9995) return qnorm([lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t),lerp(a[3],b[3],t)]);
  var th=Math.acos(d), s=Math.sin(th), wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s;
  return [a[0]*wa+b[0]*wb, a[1]*wa+b[1]*wb, a[2]*wa+b[2]*wb, a[3]*wa+b[3]*wb]; }
function qangle(a,b){ return 2*Math.acos(Math.min(1,Math.abs(qdot(a,b)))); }
function matToQ(X,Y,Z){ // rotation matrix given by its columns
  var m00=X[0],m10=X[1],m20=X[2],m01=Y[0],m11=Y[1],m21=Y[2],m02=Z[0],m12=Z[1],m22=Z[2], tr=m00+m11+m22, s;
  if (tr>0){ s=0.5/Math.sqrt(tr+1); return qnorm([(m21-m12)*s,(m02-m20)*s,(m10-m01)*s,0.25/s]); }
  if (m00>m11 && m00>m22){ s=2*Math.sqrt(1+m00-m11-m22); return qnorm([0.25*s,(m10+m01)/s,(m02+m20)/s,(m21-m12)/s]); }
  if (m11>m22){ s=2*Math.sqrt(1+m11-m00-m22); return qnorm([(m10+m01)/s,0.25*s,(m21+m12)/s,(m02-m20)/s]); }
  s=2*Math.sqrt(1+m22-m00-m11); return qnorm([(m02+m20)/s,(m21+m12)/s,0.25*s,(m10-m01)/s]); }
function qToEul(q){ // inverse of eul(): degrees [x,y,z]
  var x=q[0],y=q[1],z=q[2],w=q[3];
  var m02=2*(x*z+y*w), m12=2*(y*z-x*w), m22=1-2*(x*x+y*y), m10=2*(x*y+z*w), m11=1-2*(x*x+z*z);
  if (Math.abs(m12) > 0.999999){   // gimbal lock at x = ±90: y and z share one axis, put it all in y
    var m00=1-2*(y*y+z*z), m20=2*(x*z-y*w);
    return [m12 < 0 ? 90 : -90, Math.atan2(-m20,m00)/D, 0]; }
  return [Math.asin(clamp(-m12,-1,1))/D, Math.atan2(m02,m22)/D, Math.atan2(m10,m11)/D]; }

// ---- skeleton: +Y up, figure faces +Z, figure's LEFT is +X. 1 unit = 1 m, 1.60 tall (7.5 heads) ----
var B = { spine:0.17, chest:0.25, neck:0.06, head:0.115, headR:0.105, shX:0.18, shY:-0.02, upper:0.29, fore:0.235, hand:0.085,
          hipX:0.085, hipY:-0.05, thigh:0.39, shin:0.39, ankH:0.07, heel:0.05, ball:0.13 };
var STAND_H = -B.hipY + B.thigh + B.shin + B.ankH;   // pelvis height with straight legs = 0.90
// [name, parent, offset in parent's frame]. Every joint carries a local quaternion; children inherit it.
var J = [
  ['pelvis',null,[0,0,0]], ['spine','pelvis',[0,B.spine,0]], ['chest','spine',[0,B.chest,0]], ['neck','chest',[0,B.neck,0]], ['head','neck',[0,B.head,0]],
  ['shoulderL','chest',[B.shX,B.shY,0]], ['elbowL','shoulderL',[0,-B.upper,0]], ['wristL','elbowL',[0,-B.fore,0]], ['handL','wristL',[0,-B.hand,0]],
  ['shoulderR','chest',[-B.shX,B.shY,0]], ['elbowR','shoulderR',[0,-B.upper,0]], ['wristR','elbowR',[0,-B.fore,0]], ['handR','wristR',[0,-B.hand,0]],
  ['hipL','pelvis',[B.hipX,B.hipY,0]], ['kneeL','hipL',[0,-B.thigh,0]], ['ankleL','kneeL',[0,-B.shin,0]], ['toeL','ankleL',[0,-B.ankH,B.ball]], ['heelL','ankleL',[0,-B.ankH,-B.heel]],
  ['hipR','pelvis',[-B.hipX,B.hipY,0]], ['kneeR','hipR',[0,-B.thigh,0]], ['ankleR','kneeR',[0,-B.shin,0]], ['toeR','ankleR',[0,-B.ankH,B.ball]], ['heelR','ankleR',[0,-B.ankH,-B.heel]]
];
var PARENT = {}; J.forEach(function(j){ PARENT[j[0]] = j[1]; });

// Limits in degrees for the L side / centre joints: [xmin,xmax, ymin,ymax, zmin,zmax]. R side mirrors y and z.
var LIM = {
  pelvis:[-30,30,-90,90,-20,20], spine:[-30,45,-40,40,-30,30], neck:[-45,50,-70,70,-35,35],
  shoulderL:[-175,60,-70,70,-30,175], elbowL:[-150,0,0,0,0,0], wristL:[-60,60,0,0,-30,30],
  hipL:[-125,30,-50,50,-27,45], kneeL:[0,150,0,0,0,0], ankleL:[-40,50,-15,15,-20,20]
};
function limits(n){
  if (LIM[n]) return LIM[n];
  var l = LIM[n.slice(0,-1)+'L']; if (!l) return null;
  return [l[0],l[1], -l[3],-l[2], -l[5],-l[4]];
}
function clampJoint(n,e){ var l=limits(n); if(!l) return e; return [clamp(e[0],l[0],l[1]), clamp(e[1],l[2],l[3]), clamp(e[2],l[4],l[5])]; }

function newPose(){ return { root:[0,STAND_H,0], q:{}, breath:0, sword:0, v:0, contact:null }; }
function fk(pose){
  var W = {};
  for (var i=0;i<J.length;i++){
    var j=J[i], n=j[0], lq=pose.q[n]||QI;
    if (!j[1]){ W[n] = { p:pose.root.slice(), q:lq }; continue; }
    var P=W[j[1]], o=j[2];
    if (pose.breath){ if (n==='chest') o=[0,o[1]+pose.breath*0.008,0]; else if (n==='shoulderL'||n==='shoulderR') o=[o[0],o[1]+pose.breath*0.006,o[2]]; }
    W[n] = { p:add(P.p, qrot(P.q,o)), q:qmul(P.q,lq) };
  }
  return W;
}
function footQ(yaw,pitch){ return qmul(qy(yaw*D), qx(-pitch*D)); }   // pitch > 0 = toes up
var FOOT_HEEL=[0,-B.ankH,-B.heel], FOOT_BALL=[0,-B.ankH,B.ball];

// Two-bone analytic IK. Writes hip (ball joint), knee (one-way hinge about local X, flex >= 0) and ankle rotations.
function legIK(pose, side, target, fq){
  var s = side==='L'?1:-1, pq=pose.q.pelvis||QI;
  var hip = add(pose.root, qrot(pq,[s*B.hipX,B.hipY,0]));
  var dv = sub(target,hip), d = len(dv), dir = mul(dv,1/(d||1));
  var L1=B.thigh, L2=B.shin, dc=clamp(d, 0.08, (L1+L2)*0.9999);
  var a = Math.acos(clamp((L1*L1+dc*dc-L2*L2)/(2*L1*dc),-1,1));
  var knee = Math.PI - Math.acos(clamp((L1*L1+L2*L2-dc*dc)/(2*L1*L2),-1,1));
  // Knee aims mostly where the FOOT points (not the pelvis), a touch outward, so a turned stance doesn't twist the ankle.
  var fF = qrot(fq,[0,0,1]), fh = Math.hypot(fF[0],fF[2]) || 1, pF = qrot(pq,[0,0,1]);
  var pole = [0.3*pF[0] + 0.7*fF[0]/fh + s*0.10, 0.3*pF[1], 0.3*pF[2] + 0.7*fF[2]/fh];
  pole = sub(pole, mul(dir,dot(pole,dir)));
  var pl = len(pole);
  if (pl < 0.25){   // target nearly along the pole (leg raised far forward): fade toward "knee up" so the knee plane never flips
    var up = qrot(pq,[0,1,0]); up = sub(up, mul(dir,dot(up,dir)));
    var k = 1 - pl/0.25; pole = add(mul(pole, (1-k)/(pl||1)), mul(norm(up), k));
  }
  pole = norm(pole);
  var t = add(mul(dir,Math.cos(a)), mul(pole,Math.sin(a)));
  var Zw = add(mul(dir,-Math.sin(a)), mul(pole,Math.cos(a)));
  var Yw = mul(t,-1), Xw = cross(Yw,Zw);
  var qThigh = matToQ(Xw,Yw,Zw);
  pose.q['hip'+side] = qmul(qconj(pq), qThigh);
  pose.q['knee'+side] = qx(knee);
  pose.q['ankle'+side] = qmul(qconj(qmul(qThigh, qx(knee))), fq);
  return d/(L1+L2);
}
function stabilizeHead(pose, pitch, yaw, k){
  var W = fk(pose);
  var local = qmul(qconj(W.chest.q), eul(pitch, yaw, 0));
  pose.q.neck = qslerp(pose.q.neck||QI, local, k);
}

// ---- gait (walk / run share one generator) ----
// hip motion baked at the "no sway" setting มินิ picked (18 ก.ย. 69): no lateral shift, no pelvic drop, only a trace of
// pelvic rotation, a narrow stance, and a torso that counter-rotates less. The page's สาย row can still dial it back up.
var WALK = { T:1.0, S:1.15, d:0.60, zS:0.25, footX:0.036, ur1:0.12, ur2:0.60, th:8, tt:35, lift:0.05,
  h:0.87, bob:0.018, bobPh:0, yaw:1.5, tilt:0, sway:0, swayPh:0.05, lean:4, spLean:1, chLean:0, spYaw:0.9, chYaw:0.7,
  armC:3, armA:17, armLag:-0.03, elb:14, elbA:12, abd:7, headPitch:1 };
var RUN  = { T:0.68, S:1.95, d:0.34, zS:0.14, footX:0.0234, ur1:0.10, ur2:0.45, th:6, tt:45, lift:0.16,
  h:0.85, bob:0.025, bobPh:0.17, yaw:2.4, tilt:0, sway:0, swayPh:-0.08, lean:12, spLean:4, chLean:1, spYaw:1.17, chYaw:0.875,
  armC:13, armA:38, armLag:-0.2, elb:88, elbA:10, abd:10, headPitch:-4 };

function gaitFoot(G, t, side){
  var off = side==='R'?0:0.5, x = t/G.T+off, c = Math.floor(x), ph = x-c;
  var fx = (side==='L'?1:-1)*G.footX, Lhb = B.heel+B.ball;
  function stance(cyc,u){
    var Hz = (cyc-off)*G.S + G.zS, p, q;
    if (u < G.ur1){ var r=1-u/G.ur1; p=G.th*r*r; q=footQ(0,p); return { a:sub([fx,0,Hz], qrot(q,FOOT_HEEL)), p:p, c:'heel' }; }
    if (u <= G.ur2) return { a:[fx,B.ankH,Hz+B.heel], p:0, c:'flat' };
    var w=(u-G.ur2)/(1-G.ur2); p=-G.tt*w*w; q=footQ(0,p);
    return { a:sub([fx,0,Hz+Lhb], qrot(q,FOOT_BALL)), p:p, c:'ball' };
  }
  if (ph < G.d){ var st = stance(c, ph/G.d); st.stance = true; return st; }
  var s = (ph-G.d)/(1-G.d), e = 1e-4, k = (1-G.d)/G.d/e;
  var A0 = stance(c,1), A0b = stance(c,1-e), A1 = stance(c+1,0), A1b = stance(c+1,e);
  var h00=2*s*s*s-3*s*s+1, h10=s*s*s-2*s*s+s, h01=-2*s*s*s+3*s*s, h11=s*s*s-s*s;
  function H(p0,p0b,p1,p1b){ return h00*p0 + h10*(p0-p0b)*k + h01*p1 + h11*(p1b-p1)*k; }
  var a = [ fx, H(A0.a[1],A0b.a[1],A1.a[1],A1b.a[1]), H(A0.a[2],A0b.a[2],A1.a[2],A1b.a[2]) ];
  a[1] += G.lift*28.94*s*s*(1-s)*(1-s)*(1-s);   // clearance bump: zero slope at toe-off AND heel strike, peak = lift at s=0.4
  return { a:a, p:H(A0.p,A0b.p,A1.p,A1b.p), c:null, stance:false, sw:s };
}

function solveLeg(p, S, a, q, stance){
  var r = legIK(p, S, a, q);
  if (!stance){ var ae = qToEul(p.q['ankle'+S]), ac = clampJoint('ankle'+S, ae);   // swing foot: keep the ankle inside its range
    if (ac[0]!==ae[0]||ac[1]!==ae[1]||ac[2]!==ae[2]) p.q['ankle'+S] = eul(ac[0],ac[1],ac[2]); }
  return r;
}

function gaitPose(G, t){
  var p = newPose(), ph = frac(t/G.T), w = TAU*ph, v = G.S/G.T;
  var yaw = G.yaw*Math.cos(w), tilt = -G.tilt*Math.sin(w-TAU*G.swayPh);
  p.root = [ -G.sway*Math.sin(w-TAU*G.swayPh), G.h - G.bob*Math.cos(2*(w-TAU*G.bobPh)), 0 ];
  p.q.pelvis = eul(G.lean, yaw, tilt);
  p.q.spine  = eul(G.spLean, -yaw*G.spYaw, -tilt*0.6);
  p.q.chest  = eul(G.chLean, -yaw*G.chYaw, -tilt*0.3);
  var aw = w - TAU*G.armLag;
  p.se = {};
  [['R',-Math.cos(aw),-1],['L',Math.cos(aw),1]].forEach(function(A){
    var f=A[1], s=A[2];
    p.se['shoulder'+A[0]] = [-(G.armC+G.armA*f), s*-6, s*G.abd];
    p.q['shoulder'+A[0]] = eul(-(G.armC+G.armA*f), s*-6, s*G.abd);
    p.q['elbow'+A[0]] = eul(-(G.elb + G.elbA*(f+1)/2), 0, 0);
    p.q['wrist'+A[0]] = eul(-6, 0, 0);
  });
  p.contact = {}; p.feet = {};
  ['R','L'].forEach(function(S){
    var f = gaitFoot(G,t,S), a = [f.a[0], f.a[1], f.a[2]-v*t], q = footQ(0,f.p);
    solveLeg(p, S, a, q, f.stance);
    p.contact[S] = f.c;
    p.feet[S] = { a:a, q:q, st:f.stance, c:f.c, rem: f.stance ? 0 : (1-f.sw)*(1-G.d)*G.T };
  });
  stabilizeHead(p, G.headPitch, 0, 0.85);
  p.v = v;
  return p;
}

function idlePose(t){

      var ph2 = (2 + hash3(pi, 2, 47)*4.5)*s; prism(px, py, pz2, 0.75*s, ph2, 8, stone, pa, 0.9);
      if (hash3(pi,3,53) > 0.5) prism(px, py + ph2, pz2, 0.85*s, 0.3*s, 8, dust, pa, 1); }
  } else if (k === 'buried'){
    box(o.x, y + 0.5*s, o.z, 3.0*s, 0.5*s, 0.6*s, dust, o.rot);
    box(o.x + Math.cos(o.rot)*2.4*s, y + 1.1*s, o.z + Math.sin(o.rot)*2.4*s, 0.7*s, 1.1*s, 0.6*s, stone, o.rot);
  }
}

// ---------- miniatures: a compact armoured figure on a base, ~28 faces ----------
var UNIT_COL = {
  heavy:    { plate:[92,112,150], trim:[196,168,92], visor:[30,32,42], base:[52,54,60] },
  infantry: { plate:[96,104,72],  trim:[120,128,92], visor:[34,34,30], base:[52,54,60] },
  hoplite:  { plate:[184,134,66], trim:[214,204,182], visor:[24,22,20], base:[52,54,60] },
  enemy:    { plate:[132,52,54],  trim:[70,26,28],   visor:[240,180,90], base:[44,40,42] }
};
var units = [];
var RIGQ = SKRIG, POSE_CACHE = {};
function rigFaces(u){                    // the kit's geometry, already moved onto the table
  var kit = u.k === 'enemy' ? 'heavy' : u.k, key = kit + '|' + (u.pv||0);
  var cached = POSE_CACHE[key];
  if (!cached){
    var P = RIGQ.idlePose((u.pv||0)*1.7);           // a standing pose, each model at a slightly different breath phase
    MINI.pose(kit, P);
    var Wd = RIGQ.fk(P), n, out = {};
    for (n in Wd) out[n] = { p: Wd[n].p, q: Wd[n].q };
    cached = POSE_CACHE[key] = { Wd: out, faces: null };
    cached.faces = MINI.build(kit, out).map(function(f){ return { p: f.p.map(function(q){ return q.slice(); }), k: f.k }; });
  }
  return cached.faces;
}
function drawRig(u, S){
  var faces = rigFaces(u), pal = MINI.SOLID[u.k === 'enemy' ? 'heavy' : u.k] || MINI.SOLID.heavy;
  var y = heightAt(u.x, u.z), c = Math.cos(u.rot||0), sn = Math.sin(u.rot||0), i, m, ENEMY = u.k === 'enemy';
  for (i=0;i<faces.length;i++){
    var f = faces[i], pts = [], col = pal[f.k] || pal.plate;
    if (ENEMY) col = [col[0]*0.55 + 120, col[1]*0.45, col[2]*0.45];
    for (m=0;m<f.p.length;m++){ var q = f.p[m];
      pts.push([ u.x + (q[0]*c + q[2]*sn)*S, y + q[1]*S, u.z + (-q[0]*sn + q[2]*c)*S ]); }
    face(pts, col, { bias:-0.15 });
  }
}
function drawUnit(u){
  var C = UNIT_COL[u.k] || UNIT_COL.heavy, y = heightAt(u.x, u.z), s = 1.0, rot = u.rot || 0;
  shadowAt(u.x, u.z, 0.8, 0.34);
  var pa = proj([u.x, y, u.z]), pb = proj([u.x, y + 1.8, u.z]), px = (pa[2] > 0.4 && pb[2] > 0.4) ? Math.abs(pa[1]-pb[1]) : 0;
  if (px > 32 && rigBudget > 0 && !dragging){       // close enough to be worth the real model
    rigBudget--; prism(u.x, y, u.z, 0.62, 0.1, 12, C.base, rot, 1); drawRig(u, 1.0);
    if (u.sel) ringAt(u.x, u.z, 0.95, '#E0B26A');
    return;
  }
  prism(u.x, y, u.z, 0.62, 0.16, 12, C.base, rot, 1);              // base disc
  var b = y + 0.16;
  box(u.x, b + 0.38, u.z, 0.30, 0.38, 0.22, C.plate, rot);         // legs block
  box(u.x, b + 0.95, u.z, 0.40, 0.30, 0.26, C.plate, rot);         // torso
  box(u.x, b + 1.2, u.z, 0.16, 0.12, 0.30, C.trim, rot);           // chest trim
  var sx = Math.cos(rot), sz = -Math.sin(rot);                      // shoulder axis
  box(u.x + sx*0.46, b + 1.16, u.z + sz*0.46, 0.18, 0.20, 0.24, C.plate, rot);   // pauldrons
  box(u.x - sx*0.46, b + 1.16, u.z - sz*0.46, 0.18, 0.20, 0.24, C.plate, rot);
  box(u.x, b + 1.46, u.z, 0.19, 0.18, 0.21, C.plate, rot);          // helmet
  var fx = Math.sin(rot), fz = Math.cos(rot);                       // facing
  box(u.x + fx*0.19, b + 1.44, u.z + fz*0.19, 0.13, 0.07, 0.04, C.visor, rot);   // visor slit
  if (u.k === 'hoplite'){ box(u.x, b + 1.72, u.z, 0.05, 0.16, 0.22, C.trim, rot);          // crest
    box(u.x - sx*0.52, b + 1.0, u.z - sz*0.52, 0.06, 0.34, 0.34, C.trim, rot); }           // shield
  else { box(u.x + sx*0.52 + fx*0.18, b + 0.92, u.z + sz*0.52 + fz*0.18, 0.09, 0.09, 0.42, C.visor, rot); }   // weapon
  if (u.sel){ ringAt(u.x, u.z, 0.95, '#E0B26A'); }
}
function ringAt(x, z, r, col, dash){
  var pts = [], n = 20, i; for (i=0;i<=n;i++){ var a = i*TAU/n, px = x+Math.cos(a)*r, pz = z+Math.sin(a)*r, p = proj([px, heightAt(px,pz)+0.05, pz]); if (p[2] < 0.4) return; pts.push(p); }
  OVER.push(function(){ ctx.strokeStyle = col; ctx.lineWidth = 2; if (dash) ctx.setLineDash(dash); ctx.beginPath();
    for (var k=0;k<pts.length;k++){ k ? ctx.lineTo(pts[k][0], pts[k][1]) : ctx.moveTo(pts[k][0], pts[k][1]); } ctx.stroke(); ctx.setLineDash([]); });
}
var OVER = [];
function shadowAt(x, z, r, k){    // a soft dark patch on the ground so pieces sit in the terrain instead of hovering
  var n = 7, pts = [], i, off = 0.35*r;
  for (i=0;i<n;i++){ var a = i*TAU/n, px = x + Math.cos(a)*r*1.05 - off, pz = z + Math.sin(a)*r*0.95 + off*0.5; pts.push([px, heightAt(px,pz)+0.04, pz]); }
  face(pts, [0,0,0], { cull:false, flat:true, bias:1.2, alpha:true, a:(k==null?0.3:k) });
}

// ---------- frame ----------
var dirty = true, dragging = false, rigBudget = 10, raf = window.requestAnimationFrame || function(f){ setTimeout(f,16); };
function drawScene(){
  setupCam(); FACES = []; OVER = [];
  var t = TH(), g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0, t.sky[0]); g.addColorStop(1, t.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  var step = dragging ? 2 : 1; rigBudget = dragging ? 0 : 7;
  drawGround(step); drawRails();
  var i, detail = dragging ? 46 : 26;
  for (i=0;i<PROPS.length;i++){ var o = PROPS[i]; if (propScale(o) < detail){ shadowAt(o.x, o.z, Math.min(o.rad*0.5, 2.6)*o.s, 0.18); propSimple(o); } else drawProp(o); }
  for (i=0;i<units.length;i++) drawUnit(units[i]);
  if (measure && measure.a){ var A = measure.a, B = measure.b || measure.a; rulerLine(A, B); }
  if (drag && dragFrom) rulerLine({x:dragFrom[0], z:dragFrom[1]}, {x:drag.x, z:drag.z}, true);
  FACES.sort(function(a,b){ return b.d - a.d; });
  for (i=0;i<FACES.length;i++){ var f = FACES[i], sp = f.sp;
    ctx.beginPath(); ctx.moveTo(sp[0][0], sp[0][1]); for (var k=1;k<sp.length;k++) ctx.lineTo(sp[k][0], sp[k][1]); ctx.closePath();
    if (f.alpha != null){ ctx.globalAlpha = f.alpha; ctx.fillStyle = f.fill; ctx.fill(); ctx.globalAlpha = 1; } else { ctx.fillStyle = f.fill; ctx.fill(); } if (f.line){ ctx.strokeStyle = f.line; ctx.lineWidth = f.lw; ctx.stroke(); } }
  for (i=0;i<OVER.length;i++) OVER[i]();
  hud();
}
function rulerLine(A, B, moving){
  var d = Math.hypot(B.x-A.x, B.z-A.z), a = proj([A.x, heightAt(A.x,A.z)+0.1, A.z]), b = proj([B.x, heightAt(B.x,B.z)+0.1, B.z]);
  ringAt(A.x, A.z, 0.5, moving ? '#ECE9E0' : '#E0B26A');
  if (a[2] < 0.4 || b[2] < 0.4) return;
  OVER.push(function(){
    ctx.strokeStyle = moving ? 'rgba(236,233,224,0.85)' : '#E0B26A'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.setLineDash([]);
    if (d < 0.05) return;
    var txt = d.toFixed(1) + '"  (' + d.toFixed(1) + ' ม.)', mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2 - 14;
    ctx.font = '600 13px Sarabun, "Noto Sans Thai", system-ui, sans-serif'; var tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(11,11,14,0.82)'; ctx.fillRect(mx-tw/2-5, my-10, tw+10, 20);
    ctx.fillStyle = moving ? '#ECE9E0' : '#E0B26A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, mx, my); ctx.textAlign = 'left';
  });
}
function hud(){
  var n = {}, i; for (i=0;i<units.length;i++) n[units[i].k] = (n[units[i].k]||0)+1;
  var parts = []; if (n.heavy) parts.push('เกราะหนัก ' + n.heavy); if (n.infantry) parts.push('ราบ ' + n.infantry); if (n.hoplite) parts.push('กรีก ' + n.hoplite); if (n.enemy) parts.push('ศัตรู ' + n.enemy);
  $('btHud').innerHTML = TH().name + ' · โต๊ะ <i>' + table.w + '×' + table.d + '</i> นิ้ว/ม.<br>ชิ้นภูมิประเทศ <i>' + PROPS.length + '</i> · หน้า <i>' + FACES.length + '</i>' + (parts.length ? '<br>' + parts.join(' · ') : '');
}
function frame(){ raf(frame); if (!dirty) return; dirty = false; drawScene(); }

// ---------- input ----------
var mode = 'look', kit = 'heavy', ptrs = {}, pinch = null, moved = false, downAt = null, drag = null, dragFrom = null, measure = null;
function unitHit(sx, sy){
  var best = null, bd = 1e9; for (var i=0;i<units.length;i++){ var u = units[i], p = proj([u.x, heightAt(u.x,u.z)+0.9, u.z]); if (p[2] < 0.4) continue;
    var d = Math.hypot(p[0]-sx, p[1]-sy); if (d < 28 && d < bd){ bd = d; best = u; } } return best;
}
cv.addEventListener('pointerdown', function(ev){ cv.setPointerCapture(ev.pointerId); var r = cv.getBoundingClientRect(), p = [ev.clientX-r.left, ev.clientY-r.top];
  ptrs[ev.pointerId] = p; moved = false; downAt = p.slice();
  var ids = Object.keys(ptrs);
  if (ids.length === 2){ var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch = { d: Math.hypot(a[0]-b[0], a[1]-b[1]), dist: cam.dist }; drag = null; return; }
  if (mode === 'place' || mode === 'erase'){ var u = unitHit(p[0], p[1]);
    if (u && mode === 'place'){ drag = u; dragFrom = [u.x, u.z]; units.forEach(function(q){ q.sel = false; }); u.sel = true; dirty = true; } } });
cv.addEventListener('pointermove', function(ev){ if (!(ev.pointerId in ptrs)) return; var r = cv.getBoundingClientRect(), p = [ev.clientX-r.left, ev.clientY-r.top], prev = ptrs[ev.pointerId];
  ptrs[ev.pointerId] = p; var ids = Object.keys(ptrs);
  if (ids.length >= 2 && pinch){ var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
    cam.dist = clamp(pinch.dist * pinch.d / Math.max(d, 1), 6, 260); moved = true; dragging = true; dirty = true; return; }
  if (Math.hypot(p[0]-downAt[0], p[1]-downAt[1]) > 5) moved = true;
  if (drag){ var w = groundHit(p[0], p[1]); if (w){ drag.x = clamp(w[0], -table.w/2, table.w/2); drag.z = clamp(w[2], -table.d/2, table.d/2); dirty = true; } return; }
  if (moved){ cam.yaw -= (p[0]-prev[0])*0.008; cam.pitch = clamp(cam.pitch + (p[1]-prev[1])*0.006, 6*DEG, 82*DEG); dragging = true; dirty = true; } });
cv.addEventListener('pointerup', function(ev){ var p = ptrs[ev.pointerId]; delete ptrs[ev.pointerId];
  if (Object.keys(ptrs).length < 2) pinch = null;
  if (dragging && !Object.keys(ptrs).length){ dragging = false; dirty = true; }
  if (drag){ drag = null; dragFrom = null; dirty = true; return; }
  if (!p || moved) return;
  var w = groundHit(p[0], p[1]); if (!w) return;
  if (mode === 'place'){ units.push({ k:kit, x:w[0], z:w[2], rot: Math.atan2(cam.tx - w[0], cam.tz - w[2]) + Math.PI, sel:false }); dirty = true; }
  else if (mode === 'erase'){ var u = unitHit(p[0], p[1]); if (u){ units.splice(units.indexOf(u), 1); dirty = true; } }
  else if (mode === 'measure'){ if (!measure || measure.b) measure = { a:{x:w[0], z:w[2]}, b:null }; else measure.b = {x:w[0], z:w[2]}; dirty = true; } });
cv.addEventListener('pointercancel', function(ev){ delete ptrs[ev.pointerId]; pinch = null; drag = null; dragging = false; dirty = true; });
cv.addEventListener('wheel', function(ev){ ev.preventDefault(); cam.dist = clamp(cam.dist * Math.pow(1.0015, ev.deltaY), 6, 260); dirty = true; }, { passive:false });
function setOn(grp, b){ Array.prototype.forEach.call(grp.querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); }); }
$('btTheme').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if (!b) return; theme = b.dataset.t; setOn($('btTheme'), b); buildTerrain(); genProps(); dirty = true; });
$('btMode').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if (!b) return; mode = b.dataset.m; setOn($('btMode'), b); if (mode !== 'measure') measure = null; dirty = true; });
$('btKit').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if (!b) return; kit = b.dataset.k; setOn($('btKit'), b); });
$('btSize').addEventListener('input', function(){ table.w = +$('btSize').value; table.d = Math.round(table.w*0.72/2)*2; $('btSizeV').textContent = table.w + '×' + table.d + ' ม.';
  cam.dist = table.w*1.3; buildTerrain(); genProps(); units = units.filter(function(u){ return Math.abs(u.x) < table.w/2 && Math.abs(u.z) < table.d/2; }); dirty = true; });
$('btNew').addEventListener('click', function(){ SEED = 1 + Math.floor(Math.random()*99999); $('btSeed').textContent = 'สนาม #' + SEED; buildTerrain(); genProps(); dirty = true; });
$('btTop').addEventListener('click', function(){ cam.pitch = 52*DEG; cam.dist = table.w*1.25; cam.tx = 0; cam.tz = 0; dirty = true; });
$('btEye').addEventListener('click', function(){ cam.pitch = 13*DEG; cam.dist = 26; dirty = true; });
window.addEventListener('resize', resize);
buildTerrain(); genProps(); resize();
cam.dist = table.w*1.15; cam.pitch = 38*DEG; raf(frame);
window.BT = { cam:cam, table:table, units:units, setTheme:function(t){ theme = t; buildTerrain(); genProps(); dirty = true; }, add:function(k,x,z){ units.push({k:k,x:x,z:z,rot:0}); dirty = true; },
  draw:drawScene, faces:function(){ return FACES.length; }, size:function(w){ table.w = w; table.d = Math.round(w*0.72/2)*2; buildTerrain(); genProps(); dirty = true; } };
})();
</script>
