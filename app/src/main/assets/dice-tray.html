<title>ถาดลูกเต๋า</title>
<style>
#dz{--bg:#0B0B0E;--ink:#ECE9E0;--sub:#9C968A;--chip:#15151A;--chipB:#2A2A32;--on:#E0B26A;--onInk:#0B0B0E;--tray:#101016;
  font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh;
  box-sizing:border-box;padding:6px 8px 12px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#dz *{box-sizing:border-box}
#dz .cap{font-size:13px;line-height:18px;min-height:20px;color:var(--sub);padding:0 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dz .cap b{color:var(--ink);font-weight:600}
#dz canvas{display:block;width:100%;height:440px;border-radius:14px;touch-action:manipulation;background:var(--bg);border:1px solid var(--chipB)}
#dz .row{display:flex;gap:6px;margin-top:6px;align-items:stretch}
#dz .grp{display:flex;gap:4px;flex:1;min-width:0}
#dz button{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--chipB);background:var(--chip);color:var(--ink);font:inherit;font-size:15px;padding:0 4px;cursor:pointer;touch-action:manipulation}
#dz button.on{background:var(--on);border-color:var(--on);color:var(--onInk);font-weight:600}
#dz button.big{flex:2;font-size:17px;font-weight:600;min-height:50px}
#dz .cnt{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid var(--chipB);background:var(--chip);font-variant-numeric:tabular-nums;font-size:16px}
#dz .res{margin-top:8px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px dashed var(--chipB);font-size:15px;line-height:22px;font-variant-numeric:tabular-nums}
#dz .res b{color:var(--on);font-size:20px}
#dz .res span{display:inline-block;min-width:26px;text-align:center;margin:1px 2px;padding:0 4px;border-radius:6px;background:var(--chip);border:1px solid var(--chipB)}
#dz .res span.hit{border-color:var(--on);color:var(--on)}
</style>
<div id="dz">
  <div class="cap" id="dzCap"><b>ถาดลูกเต๋า</b> · เลือกทรง ตั้งจำนวน แล้วทอย</div>
  <canvas id="dzCv"></canvas>
  <div class="row"><div class="grp" id="dzKind">
    <button data-k="4">d4</button><button data-k="6" class="on">d6</button><button data-k="8">d8</button><button data-k="10">d10</button><button data-k="12">d12</button><button data-k="20">d20</button>
  </div></div>
  <div class="row">
    <button id="dzMinus">−</button><div class="cnt" id="dzCnt">3 ลูก</div><button id="dzPlus">+</button>
    <button id="dzRoll" class="big">ทอย</button>
  </div>
  <div class="row"><div class="grp" id="dzTgt">
    <button data-t="0" class="on">นับรวม</button><button data-t="4">4+</button><button data-t="5">5+</button><button data-t="6">6+</button>
  </div></div>
  <div class="res" id="dzRes">ยังไม่ได้ทอย</div>
</div>

var CAM = {}, TARGET = [0, 0.05, -0.05], FOV = 46*D;
function updCam(){ var pitch = 62*D, dist = 3.5, yaw = 0;
  var px = TARGET[0]+Math.sin(yaw)*Math.cos(pitch)*dist, py = TARGET[1]+Math.sin(pitch)*dist, pz = TARGET[2]+Math.cos(yaw)*Math.cos(pitch)*dist;
  var f = norm(sub(TARGET,[px,py,pz])), r = norm(cross(f,[0,1,0])), u = cross(r,f);
  CAM = { p:[px,py,pz], f:f, r:r, u:u, fl:(W/2)/Math.tan(FOV/2) }; }
function proj(p){ var v = sub(p, CAM.p), d = dot(v, CAM.f); if (d < 0.05) return null; var s = CAM.fl/d; return { x:W/2 + dot(v,CAM.r)*s, y:H/2 - dot(v,CAM.u)*s, z:d, s:s }; }
var LIGHT = norm([-0.4, 0.9, 0.35]);
function drawTray(){
  ctx.fillStyle = '#0B0B0E'; ctx.fillRect(0,0,W,H);
  var g = ctx.createRadialGradient(W/2, H*0.6, 10, W/2, H*0.6, Math.max(W,H)*0.7); g.addColorStop(0,'rgba(224,178,106,0.09)'); g.addColorStop(1,'rgba(224,178,106,0)'); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  var c = [[-TRAY.x,0,-TRAY.z],[TRAY.x,0,-TRAY.z],[TRAY.x,0,TRAY.z],[-TRAY.x,0,TRAY.z]].map(proj);
  ctx.beginPath(); c.forEach(function(p,i){ if (i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }); ctx.closePath();
  ctx.fillStyle = '#101016'; ctx.fill(); ctx.strokeStyle = 'rgba(224,178,106,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(236,233,224,0.05)'; ctx.lineWidth = 1; ctx.beginPath();
  for (var x=-1;x<=1;x+=0.5){ var a = proj([x,0,-TRAY.z]), b = proj([x,0,TRAY.z]); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
  for (var z=-1.5;z<=1.5;z+=0.5){ var a2 = proj([-TRAY.x,0,z]), b2 = proj([TRAY.x,0,z]); ctx.moveTo(a2.x,a2.y); ctx.lineTo(b2.x,b2.y); } ctx.stroke();
  // low walls
  var h = 0.12, top = [[-TRAY.x,h,-TRAY.z],[TRAY.x,h,-TRAY.z],[TRAY.x,h,TRAY.z],[-TRAY.x,h,TRAY.z]].map(proj);
  ctx.strokeStyle = 'rgba(224,178,106,0.22)'; ctx.beginPath(); top.forEach(function(p,i){ if (i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); for (var i=0;i<4;i++){ ctx.moveTo(c[i].x,c[i].y); ctx.lineTo(top[i].x,top[i].y); } ctx.stroke();
}
var FACEQ = [], LBL = { 4:0.26, 6:0.5, 8:0.4, 10:0.36, 12:0.4, 20:0.33 };
function drawDie(d, p, q, glowK){
  var S = d.S, verts = S.verts.map(function(v){ return add(p, qrot(q, mul(v, d.r))); }), pv = verts.map(proj);
  if (pv.some(function(x){ return !x; })) return;
  // shadow
  var sh = proj([p[0], 0, p[2]]); if (sh){ var k = clamp(1 - p[1]/0.8, 0.2, 1); ctx.fillStyle = 'rgba(0,0,0,' + (0.55*k).toFixed(2) + ')'; ctx.beginPath(); ctx.ellipse(sh.x, sh.y, d.r*sh.s*0.9, d.r*sh.s*0.5, 0, 0, TAU); ctx.fill(); }
  FACEQ.length = 0;
  S.faces.forEach(function(f, i){ var n = qrot(q, f.n); if (dot(n, sub(add(p, qrot(q, mul(f.c, d.r))), CAM.p)) >= 0) return;   // back face
    var z = 0; f.v.forEach(function(vi){ z += pv[vi].z; }); FACEQ.push({ i:i, z:z/f.v.length, n:n }); });
  FACEQ.sort(function(a,b){ return b.z - a.z; });
  for (var k=0;k<FACEQ.length;k++){ var F = FACEQ[k], f = S.faces[F.i], lam = Math.max(0, dot(F.n, LIGHT)), w = 0.08 + 0.22*lam;
    ctx.beginPath(); f.v.forEach(function(vi, j){ var P = pv[vi]; if (j) ctx.lineTo(P.x,P.y); else ctx.moveTo(P.x,P.y); }); ctx.closePath();
    ctx.fillStyle = 'rgb(' + Math.round(11+(236-11)*w) + ',' + Math.round(11+(233-11)*w) + ',' + Math.round(14+(224-14)*w) + ')'; ctx.fill();
    if (glowK > 0){ ctx.strokeStyle = 'rgba(224,178,106,' + (0.18*glowK).toFixed(2) + ')'; ctx.lineWidth = 6; ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,252,244,' + (0.55 + 0.4*lam).toFixed(2) + ')'; ctx.lineWidth = Math.max(1, 0.012*pv[f.v[0]].s); ctx.stroke();
    // label(s) in the face plane
    if (d.labels){
      if (S.opts.vertexRead){ // d4: three numbers per face, each at a corner = value of the face opposite that corner
        f.v.forEach(function(vi){ var opp = -1; S.faces.forEach(function(g,gi){ if (g.v.indexOf(vi) < 0) opp = gi; });
          var pos = add(p, qrot(q, mul(add(mul(f.c,0.45), mul(S.verts[vi],0.55)), d.r))); faceText(String(d.labels[opp]), pos, F.n, q, f, d, lam, 0.26, S.verts[vi], p); });
      } else { var pos = add(p, qrot(q, mul(f.c, d.r*1.002))); faceText(String(d.labels[F.i]), pos, F.n, q, f, d, lam, LBL[d.kind], null, p); }
    }
  }
}
// text drawn IN the plane of a face: build the face's 2-D basis in screen space and let the canvas transform do the tilt
function faceText(s, pos, n, q, f, d, lam, scale, towardV, p){
  var c = pos, e0 = add(p, qrot(q, mul(d.S.verts[f.v[0]], d.r))), e1 = add(p, qrot(q, mul(d.S.verts[f.v[1]], d.r)));
  var ux = norm(sub(e1, e0)), uy = norm(cross(n, ux));
  if (towardV){ var tv = sub(add(p, qrot(q, mul(towardV, d.r))), c); uy = norm(sub(tv, mul(n, dot(tv,n)))); ux = cross(uy, n); }   // d4: numbers stand up toward their corner
  else { var upw = [0,1,0], t = sub(upw, mul(n, dot(upw,n))); if (len(t) > 0.2){ uy = norm(t); ux = cross(uy, n); } else { var sv = sub([0,0,-1], mul(n, dot([0,0,-1],n))); uy = norm(sv); ux = cross(uy, n); } }
  var sz = d.r*scale, P0 = proj(c), Px = proj(add(c, mul(ux, sz))), Py = proj(add(c, mul(uy, sz))); if (!P0||!Px||!Py) return;
  var ax = Px.x-P0.x, ay = Px.y-P0.y, bx = Py.x-P0.x, by = Py.y-P0.y;
  if (ax*by - ay*bx > 0){ ax = -ax; ay = -ay; }   // keep the text un-mirrored
  ctx.save(); ctx.transform(ax, ay, -bx, -by, P0.x, P0.y);
  ctx.font = '600 ' + (s.length > 1 ? 0.9 : 1.05) + 'px Sarabun, "Noto Sans Thai", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,252,244,' + (0.7 + 0.3*lam).toFixed(2) + ')'; ctx.fillText(s, 0, 0.02);
  if (s === '6' || s === '9'){ ctx.fillRect(-0.28, 0.44, 0.56, 0.07); }
  ctx.restore();
}

// ---------- loop ----------
var running = false, dirty = true, last = null, raf = window.requestAnimationFrame ? function(f){ return window.requestAnimationFrame(f); } : function(f){ return setTimeout(function(){ f(Date.now()); }, 16); };
var glow = 0;
function frame(ts){
  raf(frame); resize(); var now = (ts||0)/1000, dt = last===null ? 0 : Math.min(0.05, now-last); last = now;
  if (!playing && !dirty) return;
  drawTray();
  if (dice.length){
    var fi = Math.min(frames.length-1, Math.floor(playT*REPLAY_FPS)), fr = frames[fi];
    var order = dice.map(function(d,i){ return i; }).sort(function(a,b){ return dot(sub(fr[b].p, CAM.p), CAM.f) - dot(sub(fr[a].p, CAM.p), CAM.f); });
    var allDone = fi >= frames.length-1;
    order.forEach(function(i){ var d = dice[i], st = fr[i], p = st.p, q = st.q;
      if (st.done){ var tSince = (playT - firstDone(i))/0.28, k = clamp(tSince, 0, 1), e = 1 - Math.pow(1-k, 3); q = qslerp(dice[i].qAtDone||q, d.snapQ, e); p = [p[0], lerp(p[1], d.snapY, e), p[2]]; }
      drawDie(d, p, q, allDone ? 0.5 + 0.5*Math.sin(now*4) : 0);
    });
    if (playing){ playT += dt; if (playT > (frames.length-1)/REPLAY_FPS + 0.35){ playing = false; showResult(true); } }
  }
  dirty = false;
}
var doneAt = [];
function firstDone(i){ if (doneAt[i] === undefined){ for (var k=0;k<frames.length;k++) if (frames[k][i].done){ doneAt[i] = k/REPLAY_FPS; dice[i].qAtDone = frames[k][i].q; break; } } return doneAt[i]; }

// ---------- ui ----------
var kind = 6, count = 3, target = 0;
function showResult(final){
  var el = $('dzRes'); if (!final){ el.innerHTML = 'กำลังทอย…'; doneAt = []; return; }
  var vals = dice.map(function(d){ return d.result; }), sum = vals.reduce(function(a,b){ return a+b; }, 0);
  var html = vals.map(function(v){ return '<span' + (target && v >= target ? ' class="hit"' : '') + '>' + v + '</span>'; }).join('');
  if (target){ var hits = vals.filter(function(v){ return v >= target; }).length; html += ' &nbsp;→ ผ่าน ' + target + '+ <b>' + hits + '</b> / ' + vals.length; }
  else html += ' &nbsp;รวม <b>' + sum + '</b>';
  el.innerHTML = html;
}
Array.prototype.forEach.call(document.querySelectorAll('#dzKind button'), function(b){ b.addEventListener('click', function(){ kind = +b.dataset.k; Array.prototype.forEach.call(document.querySelectorAll('#dzKind button'), function(x){ x.classList.toggle('on', x===b); }); }); });
Array.prototype.forEach.call(document.querySelectorAll('#dzTgt button'), function(b){ b.addEventListener('click', function(){ target = +b.dataset.t; Array.prototype.forEach.call(document.querySelectorAll('#dzTgt button'), function(x){ x.classList.toggle('on', x===b); }); if (!playing && dice.length) showResult(true); }); });
function setCount(n){ count = clamp(n, 1, 12); $('dzCnt').textContent = count + ' ลูก'; }
$('dzMinus').addEventListener('click', function(){ setCount(count-1); }); $('dzPlus').addEventListener('click', function(){ setCount(count+1); });
$('dzRoll').addEventListener('click', function(){ throwDice(kind, count); });
cv.addEventListener('click', function(){ if (!playing) throwDice(kind, count); });
['resize','orientationchange','load','pageshow'].forEach(function(e){ window.addEventListener(e, function(){ resize(); }); });
document.addEventListener('visibilitychange', function(){ resize(); });
try { if (window.ResizeObserver) new ResizeObserver(function(){ resize(); }).observe(cv); } catch(_){}
resize(); raf(frame);
window.DZ = { throwDice:throwDice, dice:function(){ return dice; }, frames:function(){ return frames; }, SHAPES:SHAPES, relabel:relabel, upFace:upFace, playing:function(){ return playing; } };
})();
</script>
