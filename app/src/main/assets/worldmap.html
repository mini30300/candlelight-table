<title>โลกใหญ่</title>
<style>
#wm{--bg:#0B0B0E;--ink:#ECE9E0;--sub:#9C968A;--chip:#15151A;--chipB:#2A2A32;--on:#E0B26A;--onInk:#0B0B0E;
  font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;
  box-sizing:border-box;padding:6px 8px 12px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#wm *{box-sizing:border-box}
#wm .cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;line-height:18px;color:var(--sub);padding:0 2px 4px;white-space:nowrap;overflow:hidden}
#wm .cap b{color:var(--ink);font-weight:600}
#wm .wrap{position:relative}
#wm canvas{display:block;width:100%;height:520px;border-radius:14px;touch-action:none;background:var(--bg);border:1px solid var(--chipB)}
#wm .hud{position:absolute;left:10px;top:10px;font-size:12px;line-height:17px;color:var(--ink);background:rgba(11,11,14,0.55);padding:4px 8px;border-radius:8px;pointer-events:none;font-variant-numeric:tabular-nums}
#wm .hud i{font-style:normal;color:var(--on)}
#wm .zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
#wm .zoom button{width:40px;height:40px;font-size:20px;flex:none}
#wm .row{display:flex;gap:6px;margin-top:6px;align-items:stretch}
#wm .grp{display:flex;gap:4px;flex:1;min-width:0}
#wm button{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--chipB);background:var(--chip);color:var(--ink);font:inherit;font-size:14px;padding:0 4px;cursor:pointer;touch-action:manipulation}
#wm button.on{background:var(--on);border-color:var(--on);color:var(--onInk);font-weight:600}
#wm .note{font-size:12px;color:var(--sub);padding:6px 2px 0;line-height:17px}
</style>
<div id="wm">
  <div class="cap"><span><b>โลกใหญ่</b> · ลากเลื่อน บีบซูม</span><span id="wmSeed">โลก #1</span></div>
  <div class="wrap">
    <canvas id="wmCv"></canvas>
    <div class="hud" id="wmHud"></div>
    <div class="zoom"><button id="wmIn">+</button><button id="wmOut">−</button><button id="wm3d" style="font-size:13px;font-weight:600">3D</button></div>
  </div>
  <div class="row"><div class="grp" id="wmMode">
    <button data-m="pan" class="on">สำรวจ</button><button data-m="ruler">วัดระยะ</button><button data-m="unit">วางหน่วย</button><button data-m="erase">ลบหน่วย</button>
  </div></div>
  <div class="row"><div class="grp" id="wmKit">
    <button data-k="heavy" class="on">เกราะหนัก</button><button data-k="infantry">ทหารราบ</button><button data-k="hoplite">ทหารกรีก</button><button data-k="enemy">ศัตรู</button>
  </div></div>
  <div class="row">
    <button id="wmHex" class="on">ตาราง</button><button id="wmLabels" class="on">ชื่อเมือง</button><button id="wmNew">สุ่มโลกใหม่</button><button id="wmHome">กลับจุดเริ่ม</button>
  </div>
  <div class="row"><div class="grp" id="wmPinRow">
    <button id="wmPinAdd">ปักหมุดตรงกลาง</button><button id="wmPinNext">ไปหมุดถัดไป</button><button id="wmPinDel">ลบหมุดนี้</button>
  </div></div>
  <div class="row" style="align-items:center">
    <input id="wmGo" placeholder="พิกัด กม. เช่น 120, -40  หรือ  โลก 4821" style="flex:2;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--chipB);background:var(--chip);color:var(--ink);font:inherit;font-size:14px;padding:0 10px">
    <button id="wmGoBtn" style="flex:0 0 72px">ไป</button>
  </div>
  <div class="note" id="wmNote">ซูมออกสุดเห็นแผ่นดินกว้าง 6,000+ กม. ซูมเข้าสุดเห็นต้นไม้ทีละต้น ช่องละ 2 ม. · แม่น้ำ ถนน เมือง ป่า ทะเลทราย หิมะ สุ่มจากเลขโลก · หน่วยที่วางจะจำไว้ในเครื่องนี้</div>
</div>
<script>
(function(){

function townName(i,j){ var a = Math.floor(hash3(i,j,6)*SYL1.length), b = Math.floor(hash3(i,j,7)*SYL2.length), c = Math.floor(hash3(i,j,8)*SYL3.length); return SYL1[a]+SYL2[b]+SYL3[c]; }

function isCapital(s){ return s.size === 3 && s.h < 0.13; }

function rankFor(mpp){ return mpp > 2500 ? 3.92 : mpp > 1200 ? 3.75 : mpp > 500 ? 3.3 : mpp > 200 ? 2.7 : mpp > 80 ? 2.0 : 0; }

function roadsIn(x0, y0, x1, y1){ var pad = 120000, ss = sitesIn(x0-pad, y0-pad, x1+pad, y1+pad), out = [], seen = {};

var RSYL = ['สีเงิน','หมอกดำ','ลมหอน','ดาวตก','เกลือขาว','ตะวันตก','ตะวันออก','เพลิงเก่า','กระดูก','นกอินทรี','เงาหมาป่า','ฟ้าคราม','ราชันย์','เถ้าถ่าน','กระซิบ','แสงจันทร์','งูใหญ่','สายฟ้า','เดือนดับ','ขวานหัก','ไข่มุก','ดอกไฟ','เหล็กกล้า','หมื่นปี'];
function regionsIn(x0, y0, x1, y1){ var out = [], cs = 380000, i0 = Math.floor(x0/cs)-1, i1 = Math.floor(x1/cs)+1, j0 = Math.floor(y0/cs)-1, j1 = Math.floor(y1/cs)+1;
  for (var i=i0;i<=i1;i++) for (var j=j0;j<=j1;j++){ var key = i+','+j, r = REG[key];

var PSYL = ['หมาป่า','งูดำ','เงาราตรี','ราชาเก่า','กระดูกยักษ์','ตาเดียว','สามพี่น้อง','หมอกแดง','ผีเสื้อ','นางฟ้า','เขี้ยวหิน','พ่อมดขาว','ลมกรด','เพลิงเย็น'];

  ctx.fillStyle = '#0B0B0E'; ctx.fillRect(0,0,W,H);
  if (tilt) draw3D(); else drawTiles(ctx, W, H, view.cx, view.cy);
  var hs = hexOn ? drawHex() : 0;
  if (labelsOn) drawLabels();
  drawPins(); drawUnits(); drawDrag(hs); drawRuler(hs); drawScaleBar();
  var c = toWorld(W/2, H/2), e = elevation(c[0], c[1]), m = moisture(c[0], c[1]), tn = terrainName(e, m, e > SEA ? forestAt(c[0], c[1], m) : 0);
  $('wmHud').innerHTML = 'มองกว้าง <i>' + fmtDist(W*view.mpp) + '</i> · กลางจอ ' + tn + ' ' + (e <= SEA ? 'ลึก ' + Math.round(-e) + ' ม.' : 'สูง ' + Math.round(e) + ' ม.') + (hs ? '<br>1 ช่อง = <i>' + fmtDist(hs) + '</i>' : '') + ' · ' + (Math.round(c[0]/100)/10) + ', ' + (Math.round(c[1]/100)/10) + ' กม.';
}
function frame(){ raf(frame); resize(); if (!dirty) return; dirty = false; draw(); }

// ---------- input ----------
var mode = 'pan', kit = 'heavy', ptrs = {}, pinch = null, moved = false, downAt = null, dragUnit = null;
function setZoom(mpp, sx, sy){ var w = toWorld(sx, sy); view.mpp = clamp(mpp, MPP_MIN, MPP_MAX); if (tilt) setupP3(); var w2 = toWorld(sx, sy); view.cx += w[0]-w2[0]; view.cy += w[1]-w2[1]; if (tilt) setupP3(); dirty = true; }
function unitAt(sx, sy){ for (var i=units.length-1;i>=0;i--){ var p = toScreen(units[i].x, units[i].y); if (Math.hypot(p[0]-sx, p[1]-sy) < 18) return units[i]; } return null; }
cv.addEventListener('pointerdown', function(ev){ cv.setPointerCapture(ev.pointerId); var r = cv.getBoundingClientRect(), p = [ev.clientX-r.left, ev.clientY-r.top]; ptrs[ev.pointerId] = p; moved = false; downAt = p.slice();
  var ids = Object.keys(ptrs); if (ids.length === 2){ var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch = { d:Math.hypot(a[0]-b[0],a[1]-b[1]), mpp:view.mpp, mid:[(a[0]+b[0])/2,(a[1]+b[1])/2] }; dragUnit = null; }
  else if (mode === 'unit'){ dragUnit = unitAt(p[0], p[1]); if (dragUnit){ dragFrom = [dragUnit.x, dragUnit.y]; dirty = true; } } });
var dragFrom = null;
function drawDrag(hexSize){ if (!dragUnit || !dragFrom) return; var a = toScreen(dragFrom[0], dragFrom[1]), b = toScreen(dragUnit.x, dragUnit.y), d = Math.hypot(dragUnit.x-dragFrom[0], dragUnit.y-dragFrom[1]); if (d < 0.01) return;
  ctx.strokeStyle = 'rgba(236,233,224,0.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(236,233,224,0.5)'; ctx.beginPath(); ctx.arc(a[0], a[1], 5, 0, TAU); ctx.stroke();
  var txt = fmtDist(d) + (hexSize ? ' · ' + (d/hexSize).toFixed(1) + ' ช่อง' : ''); ctx.font = '600 12px Sarabun, "Noto Sans Thai", system-ui, sans-serif'; var tw = ctx.measureText(txt).width;
  ctx.fillStyle = 'rgba(11,11,14,0.8)'; ctx.fillRect(b[0] - tw/2 - 5, b[1] - 34, tw + 10, 18); ctx.fillStyle = '#ECE9E0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, b[0], b[1] - 25); ctx.textAlign = 'left'; }
cv.addEventListener('pointermove', function(ev){ if (!(ev.pointerId in ptrs)) return; var r = cv.getBoundingClientRect(), p = [ev.clientX-r.left, ev.clientY-r.top], prev = ptrs[ev.pointerId]; ptrs[ev.pointerId] = p;
  var ids = Object.keys(ptrs);
  if (ids.length >= 2 && pinch){ var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a[0]-b[0],a[1]-b[1]), mid = [(a[0]+b[0])/2,(a[1]+b[1])/2];
    setZoom(pinch.mpp * pinch.d / Math.max(d, 1), mid[0], mid[1]); view.cx -= (mid[0]-pinch.mid[0])*view.mpp; view.cy -= (mid[1]-pinch.mid[1])*view.mpp/(tilt ? COS_T : 1); pinch.mid = mid; moved = true; dirty = true; return; }
  var dx = p[0]-prev[0], dy = p[1]-prev[1]; if (Math.hypot(p[0]-downAt[0], p[1]-downAt[1]) > 6) moved = true;
  if (dragUnit){ var w = toWorld(p[0], p[1]); dragUnit.x = w[0]; dragUnit.y = w[1]; dirty = true; return; }
  if (moved){ view.cx -= dx*view.mpp; view.cy -= dy*view.mpp/(tilt ? COS_T : 1); dirty = true; } });
cv.addEventListener('pointerup', function(ev){ var p = ptrs[ev.pointerId]; delete ptrs[ev.pointerId]; if (Object.keys(ptrs).length < 2) pinch = null;
  if (dragUnit){ dragUnit = null; saveUnits(); dirty = true; return; }
  if (!p || moved) return; var w = toWorld(p[0], p[1]);
  if (mode === 'ruler'){ if (!ruler || ruler.b) ruler = { a:w, b:null }; else ruler.b = w; dirty = true; }
  else if (mode === 'unit'){ units.push({ k:kit, n:nextNo(kit), x:w[0], y:w[1] }); saveUnits(); dirty = true; }
  else if (mode === 'erase'){ var u2 = unitAt(p[0], p[1]); if (u2){ units.splice(units.indexOf(u2), 1); saveUnits(); dirty = true; } } });
cv.addEventListener('pointercancel', function(ev){ delete ptrs[ev.pointerId]; pinch = null; dragUnit = null; });
cv.addEventListener('wheel', function(ev){ ev.preventDefault(); var r = cv.getBoundingClientRect(); setZoom(view.mpp * Math.pow(1.0015, ev.deltaY), ev.clientX-r.left, ev.clientY-r.top); }, { passive:false });
$('wmIn').addEventListener('click', function(){ setZoom(view.mpp/1.8, W/2, H/2); }); $('wmOut').addEventListener('click', function(){ setZoom(view.mpp*1.8, W/2, H/2); });
Array.prototype.forEach.call(document.querySelectorAll('#wmMode button'), function(b){ b.addEventListener('click', function(){ mode = b.dataset.m; Array.prototype.forEach.call(document.querySelectorAll('#wmMode button'), function(x){ x.classList.toggle('on', x===b); }); if (mode !== 'ruler') ruler = null; dirty = true; }); });
Array.prototype.forEach.call(document.querySelectorAll('#wmKit button'), function(b){ b.addEventListener('click', function(){ kit = b.dataset.k; Array.prototype.forEach.call(document.querySelectorAll('#wmKit button'), function(x){ x.classList.toggle('on', x===b); }); }); });
$('wm3d').addEventListener('click', function(){ tilt = !tilt; $('wm3d').classList.toggle('on', tilt); if (tilt) setupP3(); dirty = true; });
$('wmHex').addEventListener('click', function(){ hexOn = !hexOn; $('wmHex').classList.toggle('on', hexOn); dirty = true; });
$('wmLabels').addEventListener('click', function(){ labelsOn = !labelsOn; $('wmLabels').classList.toggle('on', labelsOn); dirty = true; });
function goHome(){ view.cx = HOME.cx; view.cy = HOME.cy; view.mpp = HOME.mpp; dirty = true; }
function newWorld(seed){ SEED = seed; cache = {}; cacheOrder = []; SITES = {}; ROADS = {}; ruler = null; $('wmSeed').textContent = 'โลก #' + SEED; loadUnits(); loadPins(); findHome(); goHome(); try { localStorage.setItem('wm-seed', String(SEED)); } catch(_){} }
$('wmNew').addEventListener('click', function(){ newWorld(1 + Math.floor(Math.random()*99999)); });
$('wmHome').addEventListener('click', goHome);
$('wmPinAdd').addEventListener('click', function(){ var c = toWorld(W/2, H/2), e = elevation(c[0], c[1]), m = moisture(c[0], c[1]); pins.push({ x:c[0], y:c[1], mpp:view.mpp, name:'หมุด ' + (pins.length+1) + ' · ' + terrainName(e, m, e > SEA ? forestAt(c[0], c[1], m) : 0) }); pinIdx = pins.length-1; savePins(); dirty = true; });
$('wmPinNext').addEventListener('click', function(){ if (!pins.length) return; pinIdx = (pinIdx + 1) % pins.length; var q = pins[pinIdx]; view.cx = q.x; view.cy = q.y; view.mpp = q.mpp || view.mpp; dirty = true; });
$('wmPinDel').addEventListener('click', function(){ if (pinIdx < 0 || pinIdx >= pins.length) return; pins.splice(pinIdx, 1); pinIdx = pins.length ? pinIdx % pins.length : -1; savePins(); dirty = true; });
function goText(t){ t = (t || '').trim(); var mw = t.match(/(?:โลก|world|#)\s*#?\s*(\d+)/i); if (mw){ newWorld(+mw[1]); }
  var nums = t.replace(/(?:โลก|world|#)\s*#?\s*\d+/i, '').match(/-?\d+(?:\.\d+)?/g); if (nums && nums.length >= 2){ view.cx = parseFloat(nums[0])*1000; view.cy = parseFloat(nums[1])*1000; if (nums.length >= 3) view.mpp = clamp(parseFloat(nums[2]), MPP_MIN, MPP_MAX); dirty = true; } }
$('wmGoBtn').addEventListener('click', function(){ goText($('wmGo').value); });
$('wmGo').addEventListener('keydown', function(ev){ if (ev.key === 'Enter'){ goText($('wmGo').value); $('wmGo').blur(); } });
try { var sv = localStorage.getItem('wm-seed'); if (sv) SEED = +sv || 1; } catch(_){}
$('wmSeed').textContent = 'โลก #' + SEED; loadUnits(); loadPins(); findHome(); goHome();
['resize','orientationchange','load','pageshow'].forEach(function(e){ window.addEventListener(e, function(){ resize(); }); });
document.addEventListener('visibilitychange', function(){ resize(); });
try { if (window.ResizeObserver) new ResizeObserver(function(){ resize(); }).observe(cv); } catch(_){}
resize(); raf(frame);
window.WM = { setTilt:function(v){ tilt = v; $('wm3d').classList.toggle('on', tilt); if (tilt) setupP3(); dirty = true; }, view:view, elevation:elevation, moisture:moisture, sitesIn:sitesIn, roadsIn:roadsIn, poisIn:poisIn, regionsIn:regionsIn, go:goText, pins:function(){ return pins; }, units:function(){ return units; }, setSeed:newWorld, cacheSize:function(){ return cacheOrder.length; }, draw:draw, home:goHome };
})();
</script>
