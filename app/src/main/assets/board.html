<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Board</title>
<style>
  html,body{margin:0;height:100%;background:#0B0B0E;overflow:hidden;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;color:#C9C4B8;-webkit-tap-highlight-color:transparent;touch-action:none}
  #c{position:fixed;left:0;top:0;display:block;touch-action:none;z-index:0}
  #joy{position:fixed;left:16px;top:56%;width:120px;height:120px;border-radius:60px;background:rgba(18,18,23,.66);border:1px solid rgba(236,233,224,.5);box-shadow:0 0 18px rgba(0,0,0,.6),inset 0 0 14px rgba(236,233,224,.07);display:none;touch-action:none;z-index:5}
  #joy .knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:22px;background:rgba(236,233,224,.3);border:1.5px solid rgba(255,252,244,.95);box-shadow:0 0 16px rgba(236,233,224,.5)}
  #toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(20,20,25,.9);border:1px solid #26262E;color:#C9C4B8;font-size:12px;padding:6px 10px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:6}
  #err{position:absolute;left:8px;right:8px;top:8px;z-index:9;color:#E0B26A;font:12px monospace;white-space:pre-wrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="joy"><div class="knob"></div></div>
<div id="toast"></div>
<div id="err"></div>
<script>window.onerror=function(m,src,l,c){var e=document.getElementById("err"); e.textContent+=m+" @"+l+":"+c+"\n"; try{ if(window.Android&&window.Android.log) window.Android.log("JS error: "+m+" @"+l+":"+c);}catch(_){} };</script>
<script>
(function(){
  "use strict";
  const bridge = window.Android || { move(){}, ready(){}, tapToken(){}, log(){} };
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const toastEl = document.getElementById("toast");
  let toastT = 0;
  function toast(s){ toastEl.textContent = s; toastEl.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(()=>toastEl.style.opacity = 0, 1800); }

  // ---------- math ----------
  const V = (x,y,z) => ({x,y,z});
  const sub = (a,b) => V(a.x-b.x, a.y-b.y, a.z-b.z), add = (a,b) => V(a.x+b.x, a.y+b.y, a.z+b.z), mul = (a,k) => V(a.x*k, a.y*k, a.z*k);
  const dot = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;
  const cross = (a,b) => V(a.y*b.z - a.z*b.y, a.z*b.x - a.x*b.z, a.x*b.y - a.y*b.x);
  const norm = a => { const l = Math.hypot(a.x,a.y,a.z) || 1; return V(a.x/l, a.y/l, a.z/l); };
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const rnd = seed => { let s = seed; return () => { s = (s*9301+49297) % 233280; return s/233280; }; };
  function hashStr(s){ let h = 7; for (const ch of String(s)) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; }
  function hexRgb(h){ h = String(h||"").replace("#",""); if (h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; const n = parseInt(h,16); if (isNaN(n) || h.length!==6) return "200,200,200"; return ((n>>16)&255)+","+((n>>8)&255)+","+(n&255); }

  // ---------- canvas / camera ----------
  let W = 0, H = 0, DPR = 1;
  function viewSize(){
    const de = document.documentElement, bd = document.body;
    let w = Math.max(window.innerWidth||0, de&&de.clientWidth||0, bd&&bd.clientWidth||0);
    let h = Math.max(window.innerHeight||0, de&&de.clientHeight||0, bd&&bd.clientHeight||0);
    if (w < 2) w = window.outerWidth || (window.screen && screen.width) || 360;
    if (h < 2) h = window.outerHeight || (window.screen && screen.height) || 640;
    return { w: Math.round(w), h: Math.round(h) };
  }
  function resize(force){
    const v = viewSize(); const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (!force && v.w === W && v.h === H && dpr === DPR) return;
    W = v.w; H = v.h; DPR = dpr;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); cv.style.width = W+"px"; cv.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize(true);
  addEventListener("resize", () => resize());
  addEventListener("orientationchange", () => resize());
  addEventListener("load", () => resize());
  document.addEventListener("visibilitychange", () => resize());
  try { if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(document.documentElement); } catch(_){}
  setTimeout(() => { try { if (W < 40 || H < 40) document.getElementById("err").textContent = "ขนาดหน้าจอที่วัดได้ = " + W + "x" + H + " (WebView ยังไม่ถูกวัดขนาด)"; } catch(_){} }, 2500);
  const FOV = 50 * Math.PI/180;
  let yaw = -0.6, pitch = 0.55, dist = 15;
  const camT = V(0, 0.4, 0);
  let cam = null;
  function updateCam(){
    const cp = Math.cos(pitch);
    const C = V(camT.x + Math.sin(yaw)*cp*dist, camT.y + Math.sin(pitch)*dist, camT.z + Math.cos(yaw)*cp*dist);
    const f = norm(sub(camT, C)); const r = norm(cross(f, V(0,1,0))); const u = cross(r, f);
    cam = { C, f, r, u, fl: (H/2)/Math.tan(FOV/2), fogN: dist*0.8, fogF: dist*2.6 };
  }
  function proj(p){ const v = sub(p, cam.C); const z = dot(v, cam.f); if (z < 0.12) return null; const s = cam.fl/z; return { x: W/2 + dot(v,cam.r)*s, y: H/2 - dot(v,cam.u)*s, z, s }; }
  function screenToFloor(sx, sy){ const d = add(add(cam.f, mul(cam.r, (sx-W/2)/cam.fl)), mul(cam.u, -(sy-H/2)/cam.fl)); if (d.y >= -1e-4) return null; const t = -cam.C.y/d.y; if (t > 200) return null; return { x: cam.C.x + d.x*t, z: cam.C.z + d.z*t }; }
  function fogA(z){ return clamp(1 - (z - cam.fogN)/(cam.fogF - cam.fogN), 0.08, 1); }

  // ---------- line styles ----------
  const WHITE = { c:"236,233,224", w:1.0, k:1 }, DIM = { c:"236,233,224", w:0.8, k:0.5 }, FAINT = { c:"236,233,224", w:0.7, k:0.28 };
  const AMB = { c:"224,178,106", w:1.3, k:1 }, TEAL = { c:"120,190,182", w:1.2, k:1 }, RED = { c:"220,110,96", w:1.0, k:1 };
  const styleOf = (rgb, w, k) => ({ c: rgb, w: w||1, k: k||1 });

  // geometry buckets: segs {a,b,s}; fills {pts,c,a}; flames {x,y,z,r,h}
  function G(){ return { segs:[], fills:[], flames:[] }; }
  const seg = (g,a,b,s) => g.segs.push({ a, b, s: s||WHITE });
  function polyline(g, pts, s, close){ for (let i=0;i<pts.length-1;i++) seg(g, pts[i], pts[i+1], s); if (close && pts.length>2) seg(g, pts[pts.length-1], pts[0], s); }
  function rotY(p, cx, cz, a){ if (!a) return p; const c = Math.cos(a), sn = Math.sin(a); const dx = p.x-cx, dz = p.z-cz; return V(cx + dx*c + dz*sn, p.y, cz - dx*sn + dz*c); }
  function wbox(g, x, y, z, w, h, d, s, ry){ // y = bottom
    const hw = w/2, hd = d/2; const c = [V(x-hw,y,z-hd),V(x+hw,y,z-hd),V(x+hw,y,z+hd),V(x-hw,y,z+hd),V(x-hw,y+h,z-hd),V(x+hw,y+h,z-hd),V(x+hw,y+h,z+hd),V(x-hw,y+h,z+hd)].map(p => rotY(p, x, z, ry));
    for (let i=0;i<4;i++){ seg(g,c[i],c[(i+1)%4],s); seg(g,c[4+i],c[4+(i+1)%4],s); seg(g,c[i],c[4+i],s); }
  }
  function ringPts(x, y, z, r, n, rz){ const pts = []; for (let i=0;i<n;i++){ const a = i/n*Math.PI*2; pts.push(V(x + Math.cos(a)*r, y, z + Math.sin(a)*(rz||r))); } return pts; }
  function wring(g, x, y, z, r, n, s, rz){ polyline(g, ringPts(x,y,z,r,n,rz), s, true); }
  function circPts(c, u, v, r, n){ const pts = []; for (let i=0;i<n;i++){ const a = i/n*Math.PI*2; pts.push(add(c, add(mul(u, Math.cos(a)*r), mul(v, Math.sin(a)*r)))); } return pts; }
  function wcircle(g, c, u, v, r, n, s){ polyline(g, circPts(c,u,v,r,n), s, true); }
  function arcPts(c, u, v, r, n, a0, a1){ const pts = []; for (let i=0;i<=n;i++){ const a = (a0 + (a1-a0)*i/n)*Math.PI/180; pts.push(add(c, add(mul(u, Math.cos(a)*r), mul(v, Math.sin(a)*r)))); } return pts; }
  function warc(g, c, u, v, r, n, a0, a1, s){ polyline(g, arcPts(c,u,v,r,n,a0,a1), s); }
  function wcyl(g, x, y, z, rt, rb, h, n, s, nv){ const b = ringPts(x,y,z,rb,n), t = ringPts(x,y+h,z,rt,n); polyline(g,b,s,true); polyline(g,t,s,true); const step = Math.max(1, Math.round(n/(nv||n))); for (let i=0;i<n;i+=step) seg(g,b[i],t[i],s); }
  function wcone(g, x, y, z, r, h, n, s, flip){ const b = ringPts(x, flip? y+h : y, z, r, n); const apex = V(x, flip? y : y+h, z); polyline(g,b,s,true); for (let i=0;i<n;i++) seg(g,b[i],apex,s); }
  function wtree(g, x, z, h, r, s){ const st = s||DIM; wcyl(g,x,0,z,0.08,0.12,0.6,4,st,2); wcone(g,x,0.6,z,r,h,5,st); wcone(g,x,0.6+h*0.45,z,r*0.7,h*0.6,5,st); }
  function wbush(g, x, z, r, s){ wring(g,x,0.05,z,r,7,s||FAINT); wring(g,x,r*0.6,z,r*0.7,6,s||FAINT); seg(g,V(x-r,0.05,z),V(x,r*1.1,z),s||FAINT); seg(g,V(x+r,0.05,z),V(x,r*1.1,z),s||FAINT); }
  function wrock(g, x, z, w, h, d, s, seed){ const r = rnd(seed||1); const st = s||DIM; const b = [V(x-w/2,0,z-d/2),V(x+w/2*(0.7+r()*0.5),0,z-d/2*(0.6+r()*0.6)),V(x+w/2,0,z+d/2),V(x-w/2*(0.6+r()*0.6),0,z+d/2*(0.7+r()*0.5))]; const t = b.map((p,i) => V((p.x+x)/2 + (r()-0.5)*0.2, h*(0.7+r()*0.4), (p.z+z)/2)); polyline(g,b,st,true); polyline(g,t,st,true); for (let i=0;i<4;i++) seg(g,b[i],t[i],st); }
  function fill(g, pts, c, a){ g.fills.push({ pts, c, a }); }
  const TUNE = window.TUNE = Object.assign({ hairOut: 1.24, hairIn: 0.82, hairA: 1, sheen: 0.42, hairLine: 1.25, tailA: 0.9 }, window.TUNE || {});
  function mixDark(rgb, k){ return String(rgb).split(",").map(v => Math.round(Number(v)*k)).join(","); }
  function mixLite(rgb, k){ return String(rgb).split(",").map(v => Math.round(Number(v) + (255-Number(v))*k)).join(","); }
  function flame(g, x, y, z, r, h){ g.flames.push({ x, y, z, r, h }); }
  function floorSlab(g, Wd, D, style){ const s = style||WHITE; const y = 0;
    fill(g, [V(-Wd/2,y,-D/2),V(Wd/2,y,-D/2),V(Wd/2,y,D/2),V(-Wd/2,y,D/2)], "236,233,224", 0.035);
    wbox(g, 0, -0.5, 0, Wd, 0.5, D, DIM); polyline(g,[V(-Wd/2,y,-D/2),V(Wd/2,y,-D/2),V(Wd/2,y,D/2),V(-Wd/2,y,D/2)], s, true);
    wbox(g, 0, -1.1, 0, Wd+0.4, 0.6, D+0.4, FAINT);
  }

  // ---------- scenes ----------
  const S = {
    preview(g){ wring(g,0,0,0,0.9,28,AMB); wring(g,0,-0.12,0,0.94,28,DIM); for (let i=0;i<8;i++){ const a = i/8*Math.PI*2; seg(g,V(Math.cos(a)*0.9,0,Math.sin(a)*0.9),V(Math.cos(a)*0.94,-0.12,Math.sin(a)*0.94),DIM); } return {w:1,d:1}; },
    tavern(g){
      const Wd=12, D=9; floorSlab(g, Wd, D);
      for (let i=-4;i<=4;i++) seg(g, V(i*1.2,0.002,-D/2), V(i*1.2,0.002,D/2), FAINT);
      // back wall + left wall (open front so we can see in)
      polyline(g,[V(-Wd/2,0,-D/2),V(-Wd/2,3.2,-D/2),V(Wd/2,3.2,-D/2),V(Wd/2,0,-D/2)],WHITE); seg(g,V(-Wd/2,3.2,-D/2),V(-Wd/2,3.2,D/2),WHITE); seg(g,V(-Wd/2,0,D/2),V(-Wd/2,3.2,D/2),DIM);
      for (let i=0;i<5;i++) seg(g, V(-Wd/2+0.01,0.6+i*0.6,-D/2), V(-Wd/2+0.01,0.6+i*0.6,D/2), FAINT);
      for (let i=0;i<3;i++) seg(g, V(-Wd/2,3.2,-D/2+2+i*2.5), V(Wd/2,3.2,-D/2+2+i*2.5), FAINT); // rafters
      // window
      wbox(g, 2.5, 1.3, -D/2+0.05, 1.2, 1.2, 0.1, WHITE); seg(g,V(2.5,1.3,-D/2+0.12),V(2.5,2.5,-D/2+0.12),DIM); seg(g,V(1.9,1.9,-D/2+0.12),V(3.1,1.9,-D/2+0.12),DIM);
      // fireplace
      wbox(g, -Wd/2+0.35, 0, -1.5, 0.7, 2.2, 2.0, WHITE); wbox(g, -Wd/2+0.6, 0, -1.5, 0.3, 1.1, 1.2, DIM); wbox(g, -Wd/2+0.35, 2.2, -1.5, 0.9, 1.0, 1.0, DIM);
      flame(g, -Wd/2+0.72, 0.1, -1.5, 0.28, 0.7);
      // bar counter + shelves + bottles + stools
      wbox(g, 3.6, 0, -2.2, 3.6, 1.0, 0.8, WHITE); wbox(g, 3.6, 1.0, -2.2, 3.8, 0.1, 1.0, WHITE);
      seg(g,V(1.8,1.7,-D/2+0.3),V(5.4,1.7,-D/2+0.3),WHITE); seg(g,V(1.8,2.3,-D/2+0.3),V(5.4,2.3,-D/2+0.3),WHITE);
      for (let i=0;i<7;i++) wcyl(g, 2.2+i*0.45, 1.72, -D/2+0.3, 0.05, 0.07, 0.32, 5, DIM, 2);
      for (let i=0;i<3;i++) wcyl(g, 2.6+i*1.0, 0, -1.3, 0.22, 0.18, 0.5, 6, DIM, 3);
      wcyl(g, 4.2, 0.2, -2.3, 0.25, 0.25, 0.5, 6, FAINT, 3); // keg on the bar? (small barrel)
      const table = (x,z) => { wcyl(g,x,0.7,z,0.9,0.85,0.1,10,WHITE,0); wcyl(g,x,0,z,0.12,0.16,0.7,5,DIM,2);
        for (const dx of [-1.15, 1.15]) { wbox(g, x+dx, 0.38, z, 0.5, 0.08, 1.2, DIM); wbox(g, x+dx, 0, z, 0.5, 0.38, 0.1, FAINT); }
        for (let i=0;i<3;i++) wcyl(g, x-0.3+i*0.3, 0.8, z+0.2, 0.08, 0.08, 0.18, 5, DIM, 2); };
      table(-1.6, 1.2); table(1.4, 2.4); table(-2.4, -2.4);
      // candles on tables
      flame(g, -1.6, 0.9, 1.2, 0.08, 0.22); flame(g, 1.4, 0.9, 2.4, 0.08, 0.22); flame(g, -2.4, 0.9, -2.4, 0.08, 0.22);
      // hanging lantern
      seg(g,V(0,3.2,0),V(0,2.4,0),DIM); wbox(g,0,2.0,0,0.3,0.4,0.3,DIM); flame(g,0,2.05,0,0.09,0.25);
      return { w: Wd/2-0.5, d: D/2-0.5 };
    },
    forest(g){
      const Wd=16, D=14; floorSlab(g, Wd, D); const r = rnd(7);
      // winding path
      const path = []; for (let i=0;i<=8;i++){ const z = -D/2 + i*(D/8); path.push([Math.sin(i*0.8)*1.4 + z*0.25, z]); }
      polyline(g, path.map(p => V(p[0]-1.2, 0.003, p[1])), FAINT); polyline(g, path.map(p => V(p[0]+1.2, 0.003, p[1])), FAINT);
      for (let i=0;i<30;i++){ const x = (r()-0.5)*Wd*0.95, z = (r()-0.5)*D*0.95; if (Math.abs(x - z*0.25 - Math.sin((z+D/2)/(D/8)*0.8)*1.4) < 1.8) continue; const h = 1.6 + r()*2.2; wtree(g, x, z, h, 0.7+r()*0.4, i%3===0 ? WHITE : DIM); }
      for (let i=0;i<8;i++) wrock(g, (r()-0.5)*Wd*0.9, (r()-0.5)*D*0.9, 0.4+r()*0.5, 0.25+r()*0.2, 0.4+r()*0.4, FAINT, i+3);
      for (let i=0;i<6;i++) wbush(g, (r()-0.5)*Wd*0.9, (r()-0.5)*D*0.9, 0.3+r()*0.3);
      // fallen log
      wcyl(g, 3.5, 0.25, 4.0, 0.25, 0.25, 2.2, 6, DIM, 3);
      return { w: Wd/2-0.5, d: D/2-0.5 };
    },
    cave(g){
      const Wd=13, D=11; floorSlab(g, Wd, D); const r = rnd(3);
      for (let i=0;i<22;i++){ const a = i/22*Math.PI*2, rad = 5.2 + r()*1.2; const x = Math.cos(a)*rad*(Wd/12), z = Math.sin(a)*rad*(D/12); wrock(g, x, z, 1.2+r(), 2.2+r()*2.5, 1.2+r(), i%2 ? DIM : FAINT, i+20); }
      for (let i=0;i<8;i++){ const x = (r()-0.5)*8, z = (r()-0.5)*6; wcone(g, x, 0, z, 0.22+r()*0.2, 0.8+r()*1.2, 5, DIM); }
      for (let i=0;i<6;i++){ const x = (r()-0.5)*8, z = (r()-0.5)*6; wcone(g, x, 2.6, z, 0.18, 1.0, 4, FAINT, true); }
      for (let i=0;i<5;i++) seg(g, V(-6+i*3, 3.6, -5), V(-4.5+i*3, 3.6, 5), FAINT); // ceiling hints
      wring(g, 2.5, 0.01, 1.5, 1.6, 20, TEAL); wring(g, 2.5, 0.01, 1.5, 1.1, 14, styleOf(TEAL.c, 0.8, 0.5)); // pool
      const gl = V(-2.5, 0.35, -2); wring(g, gl.x, gl.y, gl.z, 0.28, 6, TEAL); wcone(g, gl.x, gl.y, gl.z, 0.28, 0.3, 6, TEAL); wcone(g, gl.x, gl.y-0.3, gl.z, 0.28, 0.3, 6, TEAL, true); // crystal
      return { w: Wd/2-0.5, d: D/2-0.5 };
    },
    ruins(g){
      const Wd=14, D=12; floorSlab(g, Wd, D); const r = rnd(11);
      for (let i=0;i<8;i++){ const x = -5 + i*1.45, z = -4; const h = 0.6 + r()*2.6; wcyl(g, x, 0, z, 0.32, 0.36, h, 8, i%2? WHITE : DIM, 4); if (h>2.2) wbox(g, x, h, z, 0.9, 0.25, 0.9, DIM); }
      for (let i=0;i<5;i++){ const x = 4.5, z = -3 + i*1.45; const h = 0.5 + r()*2.4; wcyl(g, x, 0, z, 0.32, 0.36, h, 8, DIM, 4); }
      wbox(g, -1, 0, 1.5, 5, 0.35, 3, WHITE); wbox(g, -1, 0.35, 1.5, 3, 0.35, 2, WHITE); // altar steps
      wbox(g, -1, 0.7, 1.5, 1.2, 0.7, 0.6, WHITE);
      for (let i=0;i<10;i++) wrock(g, (r()-0.5)*Wd*0.9, (r()-0.5)*D*0.9, 0.3+r()*0.6, 0.2+r()*0.3, 0.3+r()*0.5, FAINT, i+40);
      for (let i=0;i<5;i++) wtree(g, (r()-0.5)*Wd*0.9, (r()-0.5)*D*0.9, 1.2, 0.5, FAINT);
      // broken arch
      seg(g,V(-6,0,3),V(-6,2.4,3),DIM); seg(g,V(-6,2.4,3),V(-4.8,3.2,3),DIM); seg(g,V(-4.8,3.2,3),V(-3.9,3.0,3),FAINT);
      return { w: Wd/2-0.5, d: D/2-0.5 };
    },

      if (!p) { p = { t, pos:{x:t.x, z:t.z}, target:{x:t.x, z:t.z}, rot: 0, isMe, moving:false, hit:null }; pawns.set(t.id, p); }
      p.t = t; p.isMe = isMe; if (!(isMe && localMoving)) p.target = { x:t.x, z:t.z };
    }
    for (const id of [...pawns.keys()]) if (!seen.has(id)) pawns.delete(id);
    const cb = board.mode==="combat" && board.combat;
    const myTurn = cb && board.combat.order && board.combat.order[board.combat.turn] && board.combat.order[board.combat.turn].id === me;
    canMove = !cb || myTurn;
    if (myTurn) { const mine = pawns.get(me); if (mine && (!turnStart || turnStart.turn !== board.combat.turn || turnStart.round !== board.combat.round)) turnStart = { pos:{ x: mine.pos.x, z: mine.pos.z }, turn: board.combat.turn, round: board.combat.round }; }
    else turnStart = null;
    showJoy();
  };
  window.setPreview = function(json){
    let look = {}; try { look = typeof json === "string" ? JSON.parse(json) : (json || {}); } catch(e) {}
    preview = true; me = "me"; board = null; currentScene = null; buildScene("preview", "night");
    pawns.clear(); pawns.set("me", { t: { id:"me", name:"", kind:"player", look, hp:1, maxHp:1 }, pos:{x:0,z:0}, target:{x:0,z:0}, rot: 0, isMe:true, moving:false, hit:null });
    dist = 2.7; pitch = 0.18; yaw = -0.4; camT.x = 0; camT.y = 0.86; camT.z = 0; showJoy();
  };
  window.setMe = function(id){ me = id; for (const p of pawns.values()) p.isMe = p.t.id === me; if (board) window.setBoard(board); showJoy(); };
  window.setControl = function(mode){ control = mode === "joystick" ? "joystick" : "tap"; showJoy(); };
  window.focusMe = function(){ const p = pawns.get(me); if (p) { camT.x = p.pos.x; camT.z = p.pos.z; } };

  // ---------- input ----------
  let dragging = false, moved = false, lastX = 0, lastY = 0, pinch0 = 0, pointers = 0;
  cv.addEventListener("pointerdown", e => { pointers++; dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY; try { cv.setPointerCapture(e.pointerId); } catch(_){} });
  cv.addEventListener("pointermove", e => { if (!dragging || pointers > 1) return; const dx = e.clientX-lastX, dy = e.clientY-lastY; if (Math.abs(dx)+Math.abs(dy) > 5) moved = true; yaw += dx*0.008; pitch = clamp(pitch + dy*0.005, 0.22, 1.3); lastX = e.clientX; lastY = e.clientY; });
  const up = e => { pointers = Math.max(0, pointers-1); if (!dragging) return; if (pointers === 0) { dragging = false; if (!moved && e.type === "pointerup") tap(e.clientX, e.clientY); } };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("touchstart", e => { if (e.touches.length===2) pinch0 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }, {passive:true});
  cv.addEventListener("touchmove", e => { if (e.touches.length===2){ moved = true; const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); if (pinch0 > 0) dist = clamp(dist*pinch0/d, preview ? 2 : 6, preview ? 6 : 26); pinch0 = d; } }, {passive:true});
  cv.addEventListener("wheel", e => { dist = clamp(dist * (e.deltaY > 0 ? 1.1 : 0.9), preview ? 2 : 6, preview ? 6 : 26); }, {passive:true});
  function tap(cx, cy){
    if (preview || !me || !board) return;
    // token hit test
    let best = null, bd = 1e9;
    for (const p of pawns.values()){ if (!p.hit || p.t.id === me) continue; const h = p.hit; const inside = cx > h.x - h.r && cx < h.x + h.r && cy > h.y - 6 && cy < h.y2 + 6; if (inside && h.z < bd) { bd = h.z; best = p; } }
    if (best) { bridge.tapToken(best.t.id); return; }
    if (control !== "tap") return;
    if (!canMove) { toast("ยังไม่ถึงเทิร์นของคุณ"); return; }
    const f = screenToFloor(cx, cy); if (!f) return;
    const x = clamp(f.x, -bounds.w, bounds.w), z = clamp(f.z, -bounds.d, bounds.d);
    if (turnStart && Math.hypot(x-turnStart.pos.x, z-turnStart.pos.z) > 6) { toast("ไกลเกินระยะเดิน 30 ft"); return; }
    const mine = pawns.get(me); if (mine) mine.target = { x, z };
    marker = { x, z, a: 1 };
    bridge.move(x, z);
  }
  // joystick
  const knob = joyEl.querySelector(".knob");
  let joyVec = {x:0, y:0}, joyActive = false, localMoving = false, lastSend = 0;
  joyEl.addEventListener("pointerdown", e => { joyActive = true; try { joyEl.setPointerCapture(e.pointerId); } catch(_){} joyMove(e); e.stopPropagation(); });
  joyEl.addEventListener("pointermove", e => { if (joyActive) joyMove(e); });
  const joyEnd = () => { joyActive = false; joyVec = {x:0,y:0}; knob.style.left = "38px"; knob.style.top = "38px"; if (localMoving) { localMoving = false; const mine = pawns.get(me); if (mine) bridge.move(mine.target.x, mine.target.z); } };
  joyEl.addEventListener("pointerup", joyEnd); joyEl.addEventListener("pointercancel", joyEnd);
  function joyMove(e){ const r = joyEl.getBoundingClientRect(); let dx = e.clientX - (r.left + 60), dy = e.clientY - (r.top + 60); const len = Math.hypot(dx, dy); if (len > 40) { dx *= 40/len; dy *= 40/len; } knob.style.left = (38+dx)+"px"; knob.style.top = (38+dy)+"px"; joyVec = { x: dx/40, y: dy/40 }; }

  // ---------- frame ----------
  let last = performance.now(), tAcc = 0;
  function frame(now){
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now-last)/1000); last = now; tAcc += dt;
    resize();
    if (joyActive && me && !preview && (joyVec.x || joyVec.y)) {
      if (!canMove) { if (!localMoving) toast("ยังไม่ถึงเทิร์นของคุณ"); }
      else { const mine = pawns.get(me); if (mine) {
        const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
        const dx = (fx*-joyVec.y + rx*joyVec.x)*3.2*dt, dz = (fz*-joyVec.y + rz*joyVec.x)*3.2*dt;
        const nx = clamp(mine.target.x + dx, -bounds.w, bounds.w), nz = clamp(mine.target.z + dz, -bounds.d, bounds.d);
        if (!turnStart || Math.hypot(nx-turnStart.pos.x, nz-turnStart.pos.z) <= 6) { mine.target = { x:nx, z:nz }; localMoving = true; if (now - lastSend > 500) { lastSend = now; bridge.move(nx, nz); } }
      } }
    }
    for (const p of pawns.values()){ const dx = p.target.x - p.pos.x, dz = p.target.z - p.pos.z; const len = Math.hypot(dx, dz);
      if (len > 0.02) { const step = Math.min(1, 4*dt/len*Math.max(len,0.5)); p.pos.x += dx*step; p.pos.z += dz*step; p.rot = Math.atan2(dx, dz); p.moving = true; } else p.moving = false; }
    marker.a *= 0.975;
    if (!preview) { const mine = pawns.get(me); if (mine && !dragging) { camT.x += (mine.pos.x*0.5 - camT.x)*0.02; camT.z += (mine.pos.z*0.5 - camT.z)*0.02; camT.y = 0.4; } }
    updateCam();
    ctx.clearRect(0,0,W,H);
    drawBackdrop(preview ? "night" : currentTime || "night", tAcc);
    const dyn = G();
    if (marker.a > 0.03) wring(dyn, marker.x, 0.02, marker.z, 0.4, 16, styleOf(TEAL.c, 1.2, marker.a));
    if (turnStart) { wring(dyn, turnStart.pos.x, 0.02, turnStart.pos.z, 6, 48, TEAL); wring(dyn, turnStart.pos.x, 0.02, turnStart.pos.z, 3, 32, styleOf(TEAL.c, 0.8, 0.4)); }
    const ov = G();
    for (const p of pawns.values()) drawPawn(dyn, p, tAcc, now, ov);
    render([geo, dyn], tAcc);
    drawFlames(geo, tAcc);
    render([ov], tAcc);
    drawLabels(now);
  }
  buildScene("tavern", "night");
  requestAnimationFrame(frame);
  bridge.ready();
})();
</script>
</body>
</html>
