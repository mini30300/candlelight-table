<title>โครงกระดูกขยับได้</title>
<style>
#skr{--bg:#FFFFFF;--ink:#2A3A55;--sub:#6B7A90;--chip:#FFFFFF;--chipB:#D9DEE6;--on:#2F6FD6;--onInk:#FFFFFF;
  font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  max-width:520px;margin:0 auto;min-height:100vh;box-sizing:border-box;padding:6px 8px 10px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#skr.game{--bg:#0B0B0E;--ink:#ECE9E0;--sub:#9C968A;--chip:#15151A;--chipB:#2A2A32;--on:#E0B26A;--onInk:#0B0B0E}
#skr *{box-sizing:border-box}
#skr .cap{font-size:13px;line-height:18px;min-height:20px;color:var(--sub);padding:0 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#skr .cap b{color:var(--ink);font-weight:600}
#skr canvas{display:block;width:100%;height:420px;border-radius:12px;touch-action:none;background:var(--bg);border:1px solid var(--chipB)}
#skr .row{display:flex;gap:6px;margin-top:6px;align-items:stretch}
#skr .row.split{gap:10px}
#skr .grp{display:flex;gap:4px;flex:1;min-width:0}
#skr #skrArm button{font-size:14px;padding:0 2px}
#skr button{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--chipB);background:var(--chip);color:var(--ink);
  font:inherit;font-size:15px;padding:0 4px;cursor:pointer;touch-action:manipulation}
#skr button.on{background:var(--on);border-color:var(--on);color:var(--onInk);font-weight:600}
#skr .pose{display:none}
#skr.posing .pose{display:flex}
#skr.posing .anim{display:none}
#skr .sl{flex:1;display:flex;align-items:center;gap:8px;min-height:44px;background:var(--chip);border:1px solid var(--chipB);border-radius:10px;padding:0 10px}
#skr .sl span{font-size:13px;color:var(--sub);width:96px;flex:none;white-space:nowrap}
#skr .sl em{font-style:normal;font-size:13px;width:40px;text-align:right;flex:none}
#skr input[type=range]{flex:1;min-width:0;height:44px;accent-color:var(--on);margin:0}
#skr .jn{flex:2;display:flex;align-items:center;padding:0 10px;font-size:15px;min-height:44px;border-radius:10px;border:1px dashed var(--chipB)}
</style>
<div id="skr">
  <div class="cap" id="skrCap">กำลังโหลด…</div>
  <canvas id="skrCv"></canvas>
  <div class="row"><div class="grp" id="skrArm">
    <button data-a="kit:none">โครงเปล่า</button><button data-a="kit:heavy" class="on">เกราะหนัก</button><button data-a="kit:infantry">ทหารราบ</button><button data-a="kit:hoplite">ทหารกรีก</button><button data-a="solid">ทึบ</button>
  </div></div>
  <div class="row"><div class="grp" id="skrSway">
    <button data-w="none" class="on">ไม่ส่ายเลย</button><button data-w="low">ส่ายน้อย</button><button data-w="mid">ส่ายกลาง</button><button data-w="old">แบบเดิม</button>
  </div></div>
  <div class="row"><div class="grp" id="skrMot">
    <button data-m="idle">ยืน</button><button data-m="walk" class="on">เดิน</button><button data-m="run">วิ่ง</button><button data-m="attack">ตี</button>
  </div></div>
  <div class="row split anim">
    <div class="grp" id="skrSpd"><button data-s="0.4">ช้า</button><button data-s="1" class="on">ปกติ</button></div>
    <div class="grp" id="skrSty"><button data-y="sketch" class="on">ภาพร่าง</button><button data-y="game">ในเกม</button></div>
  </div>
  <div class="row pose">
    <div class="jn" id="skrJn">แตะจุดสีเหลืองเพื่อเลือก</div>
    <button id="skrReset">ท่าตรง</button>
  </div>
  <div class="row pose"><label class="sl"><span id="skrL1">ก้ม / เงย</span><input type="range" id="skrS1" min="-90" max="90" step="1" value="0"><em id="skrV1">–</em></label></div>
  <div class="row pose"><label class="sl"><span id="skrL2">กาง / หุบ</span><input type="range" id="skrS2" min="-90" max="90" step="1" value="0"><em id="skrV2">–</em></label></div>
  <div class="row"><div class="grp" id="skrCam">
    <button data-c="front" class="on">มุมหน้า</button><button data-c="side">มุมข้าง</button><button data-c="orbit">หมุนรอบ</button>
  </div></div>
  <div class="row">
    <button id="skrJoints" class="on">โชว์จุดหมุน</button><button id="skrPose">ท่าเอง</button>
  </div>
</div>
<script>
// ==RIG-BEGIN==
var SKRIG = (function(){
"use strict";
var D = Math.PI/180, TAU = Math.PI*2;
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function frac(x){ return x-Math.floor(x); }
function sstep(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function inOut3(t){ t=clamp(t,0,1); return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function add(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; }
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function mul(a,s){ return [a[0]*s,a[1]*s,a[2]*s]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function len(a){ return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]); }
function norm(a){ var l=len(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; }

// ---- quaternions [x,y,z,w] ----
var QI = [0,0,0,1];
function qmul(a,b){ var ax=a[0],ay=a[1],az=a[2],aw=a[3],bx=b[0],by=b[1],bz=b[2],bw=b[3];
  return [aw*bx+ax*bw+ay*bz-az*by, aw*by-ax*bz+ay*bw+az*bx, aw*bz+ax*by-ay*bx+az*bw, aw*bw-ax*bx-ay*by-az*bz]; }
function qconj(q){ return [-q[0],-q[1],-q[2],q[3]]; }
function qrot(q,v){ var x=q[0],y=q[1],z=q[2],w=q[3];
  var ux=y*v[2]-z*v[1], uy=z*v[0]-x*v[2], uz=x*v[1]-y*v[0];
  var vx=y*uz-z*uy, vy=z*ux-x*uz, vz=x*uy-y*ux;
  return [v[0]+2*(w*ux+vx), v[1]+2*(w*uy+vy), v[2]+2*(w*uz+vz)]; }
function qx(a){ return [Math.sin(a/2),0,0,Math.cos(a/2)]; }
function qy(a){ return [0,Math.sin(a/2),0,Math.cos(a/2)]; }
function qz(a){ return [0,0,Math.sin(a/2),Math.cos(a/2)]; }
// Euler in DEGREES, R = Ry(y) * Rx(x) * Rz(z). X = flex (sagittal), Y = twist/turn, Z = side bend / abduction.
function eul(x,y,z){ return qmul(qmul(qy((y||0)*D), qx((x||0)*D)), qz((z||0)*D)); }
function qnorm(q){ var l=Math.sqrt(q[0]*q[0]+q[1]*q[1]+q[2]*q[2]+q[3]*q[3])||1; return [q[0]/l,q[1]/l,q[2]/l,q[3]/l]; }
function qdot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3]; }
function qslerp(a,b,t){
  var d=qdot(a,b), bb=b; if (d<0){ d=-d; bb=[-b[0],-b[1],-b[2],-b[3]]; }
  if (d>0.9995) return qnorm([lerp(a[0],bb[0],t),lerp(a[1],bb[1],t),lerp(a[2],bb[2],t),lerp(a[3],bb[3],t)]);
  var th=Math.acos(d), s=Math.sin(th), wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s;
  return [a[0]*wa+bb[0]*wb, a[1]*wa+bb[1]*wb, a[2]*wa+bb[2]*wb, a[3]*wa+bb[3]*wb]; }
function qslerpRaw(a,b,t){   // slerp without choosing the short hemisphere (caller picks the sign of b)
  var d = clamp(qdot(a,b),-1,1);
  if (d > 0.9995) return qnorm([lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t),lerp(a[3],b[3],t)]);
  var th=Math.acos(d), s=Math.sin(th), wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s;
  return [a[0]*wa+b[0]*wb, a[1]*wa+b[1]*wb, a[2]*wa+b[2]*wb, a[3]*wa+b[3]*wb]; }
function qangle(a,b){ return 2*Math.acos(Math.min(1,Math.abs(qdot(a,b)))); }
function matToQ(X,Y,Z){ // rotation matrix given by its columns
  var m00=X[0],m10=X[1],m20=X[2],m01=Y[0],m11=Y[1],m21=Y[2],m02=Z[0],m12=Z[1],m22=Z[2], tr=m00+m11+m22, s;
  if (tr>0){ s=0.5/Math.sqrt(tr+1); return qnorm([(m21-m12)*s,(m02-m20)*s,(m10-m01)*s,0.25/s]); }
  if (m00>m11 && m00>m22){ s=2*Math.sqrt(1+m00-m11-m22); return qnorm([0.25*s,(m10+m01)/s,(m02+m20)/s,(m21-m12)/s]); }
  if (m11>m22){ s=2*Math.sqrt(1+m11-m00-m22); return qnorm([(m10+m01)/s,0.25*s,(m21+m12)/s,(m02-m20)/s]); }
  s=2*Math.sqrt(1+m22-m00-m11); return qnorm([(m02+m20)/s,(m21+m12)/s,0.25*s,(m10-m01)/s]); }
function qToEul(q){ // inverse of eul(): degrees [x,y,z]
  var x=q[0],y=q[1],z=q[2],w=q[3];
  var m02=2*(x*z+y*w), m12=2*(y*z-x*w), m22=1-2*(x*x+y*y), m10=2*(x*y+z*w), m11=1-2*(x*x+z*z);
  if (Math.abs(m12) > 0.999999){   // gimbal lock at x = ±90: y and z share one axis, put it all in y
    var m00=1-2*(y*y+z*z), m20=2*(x*z-y*w);
    return [m12 < 0 ? 90 : -90, Math.atan2(-m20,m00)/D, 0]; }
  return [Math.asin(clamp(-m12,-1,1))/D, Math.atan2(m02,m22)/D, Math.atan2(m10,m11)/D]; }

// ---- skeleton: +Y up, figure faces +Z, figure's LEFT is +X. 1 unit = 1 m, 1.60 tall (7.5 heads) ----
var B = { spine:0.17, chest:0.25, neck:0.06, head:0.115, headR:0.105, shX:0.18, shY:-0.02, upper:0.29, fore:0.235, hand:0.085,
          hipX:0.085, hipY:-0.05, thigh:0.39, shin:0.39, ankH:0.07, heel:0.05, ball:0.13 };
var STAND_H = -B.hipY + B.thigh + B.shin + B.ankH;   // pelvis height with straight legs = 0.90
// [name, parent, offset in parent's frame]. Every joint carries a local quaternion; children inherit it.
var J = [
  ['pelvis',null,[0,0,0]], ['spine','pelvis',[0,B.spine,0]], ['chest','spine',[0,B.chest,0]], ['neck','chest',[0,B.neck,0]], ['head','neck',[0,B.head,0]],
  ['shoulderL','chest',[B.shX,B.shY,0]], ['elbowL','shoulderL',[0,-B.upper,0]], ['wristL','elbowL',[0,-B.fore,0]], ['handL','wristL',[0,-B.hand,0]],
  ['shoulderR','chest',[-B.shX,B.shY,0]], ['elbowR','shoulderR',[0,-B.upper,0]], ['wristR','elbowR',[0,-B.fore,0]], ['handR','wristR',[0,-B.hand,0]],
  ['hipL','pelvis',[B.hipX,B.hipY,0]], ['kneeL','hipL',[0,-B.thigh,0]], ['ankleL','kneeL',[0,-B.shin,0]], ['toeL','ankleL',[0,-B.ankH,B.ball]], ['heelL','ankleL',[0,-B.ankH,-B.heel]],
  ['hipR','pelvis',[-B.hipX,B.hipY,0]], ['kneeR','hipR',[0,-B.thigh,0]], ['ankleR','kneeR',[0,-B.shin,0]], ['toeR','ankleR',[0,-B.ankH,B.ball]], ['heelR','ankleR',[0,-B.ankH,-B.heel]]
];
var PARENT = {}; J.forEach(function(j){ PARENT[j[0]] = j[1]; });

// Limits in degrees for the L side / centre joints: [xmin,xmax, ymin,ymax, zmin,zmax]. R side mirrors y and z.
var LIM = {
  pelvis:[-30,30,-90,90,-20,20], spine:[-30,45,-40,40,-30,30], neck:[-45,50,-70,70,-35,35],
  shoulderL:[-175,60,-70,70,-30,175], elbowL:[-150,0,0,0,0,0], wristL:[-60,60,0,0,-30,30],
  hipL:[-125,30,-50,50,-27,45], kneeL:[0,150,0,0,0,0], ankleL:[-40,50,-15,15,-20,20]
};
function limits(n){
  if (LIM[n]) return LIM[n];
  var l = LIM[n.slice(0,-1)+'L']; if (!l) return null;
  return [l[0],l[1], -l[3],-l[2], -l[5],-l[4]];
}
function clampJoint(n,e){ var l=limits(n); if(!l) return e; return [clamp(e[0],l[0],l[1]), clamp(e[1],l[2],l[3]), clamp(e[2],l[4],l[5])]; }

function newPose(){ return { root:[0,STAND_H,0], q:{}, breath:0, sword:0, v:0, contact:null }; }
function fk(pose){
  var W = {};
  for (var i=0;i<J.length;i++){
    var j=J[i], n=j[0], lq=pose.q[n]||QI;
    if (!j[1]){ W[n] = { p:pose.root.slice(), q:lq }; continue; }
    var P=W[j[1]], o=j[2];
    if (pose.breath){ if (n==='chest') o=[0,o[1]+pose.breath*0.008,0]; else if (n==='shoulderL'||n==='shoulderR') o=[o[0],o[1]+pose.breath*0.006,o[2]]; }
    W[n] = { p:add(P.p, qrot(P.q,o)), q:qmul(P.q,lq) };
  }
  return W;
}
function footQ(yaw,pitch){ return qmul(qy(yaw*D), qx(-pitch*D)); }   // pitch > 0 = toes up
var FOOT_HEEL=[0,-B.ankH,-B.heel], FOOT_BALL=[0,-B.ankH,B.ball];

// Two-bone analytic IK. Writes hip (ball joint), knee (one-way hinge about local X, flex >= 0) and ankle rotations.
function legIK(pose, side, target, fq){
  var s = side==='L'?1:-1, pq=pose.q.pelvis||QI;
  var hip = add(pose.root, qrot(pq,[s*B.hipX,B.hipY,0]));
  var dv = sub(target,hip), d = len(dv), dir = mul(dv,1/(d||1));
  var L1=B.thigh, L2=B.shin, dc=clamp(d, 0.08, (L1+L2)*0.9999);
  var a = Math.acos(clamp((L1*L1+dc*dc-L2*L2)/(2*L1*dc),-1,1));
  var knee = Math.PI - Math.acos(clamp((L1*L1+L2*L2-dc*dc)/(2*L1*L2),-1,1));
  // Knee aims mostly where the FOOT points (not the pelvis), a touch outward, so a turned stance doesn't twist the ankle.
  var fF = qrot(fq,[0,0,1]), fh = Math.hypot(fF[0],fF[2]) || 1, pF = qrot(pq,[0,0,1]);
  var pole = [0.3*pF[0] + 0.7*fF[0]/fh + s*0.10, 0.3*pF[1], 0.3*pF[2] + 0.7*fF[2]/fh];
  pole = sub(pole, mul(dir,dot(pole,dir)));
  var pl = len(pole);
  if (pl < 0.25){   // target nearly along the pole (leg raised far forward): fade toward "knee up" so the knee plane never flips
    var up = qrot(pq,[0,1,0]); up = sub(up, mul(dir,dot(up,dir)));
    var k = 1 - pl/0.25; pole = add(mul(pole, (1-k)/(pl||1)), mul(norm(up), k));
  }
  pole = norm(pole);
  var t = add(mul(dir,Math.cos(a)), mul(pole,Math.sin(a)));
  var Zw = add(mul(dir,-Math.sin(a)), mul(pole,Math.cos(a)));
  var Yw = mul(t,-1), Xw = cross(Yw,Zw);
  var qThigh = matToQ(Xw,Yw,Zw);
  pose.q['hip'+side] = qmul(qconj(pq), qThigh);
  pose.q['knee'+side] = qx(knee);
  pose.q['ankle'+side] = qmul(qconj(qmul(qThigh, qx(knee))), fq);
  return d/(L1+L2);
}
function stabilizeHead(pose, pitch, yaw, k){
  var W = fk(pose);
  var local = qmul(qconj(W.chest.q), eul(pitch, yaw, 0));
  pose.q.neck = qslerp(pose.q.neck||QI, local, k);
}

// ---- gait (walk / run share one generator) ----
// hip motion baked at the "no sway" setting มินิ picked (18 ก.ย. 69): no lateral shift, no pelvic drop, only a trace of
// pelvic rotation, a narrow stance, and a torso that counter-rotates less. The page's สาย row can still dial it back up.
var WALK = { T:1.0, S:1.15, d:0.60, zS:0.25, footX:0.036, ur1:0.12, ur2:0.60, th:8, tt:35, lift:0.05,
  h:0.87, bob:0.018, bobPh:0, yaw:1.5, tilt:0, sway:0, swayPh:0.05, lean:4, spLean:1, chLean:0, spYaw:0.9, chYaw:0.7,
  armC:3, armA:17, armLag:-0.03, elb:14, elbA:12, abd:7, headPitch:1 };
var RUN  = { T:0.68, S:1.95, d:0.34, zS:0.14, footX:0.0234, ur1:0.10, ur2:0.45, th:6, tt:45, lift:0.16,
  h:0.85, bob:0.025, bobPh:0.17, yaw:2.4, tilt:0, sway:0, swayPh:-0.08, lean:12, spLean:4, chLean:1, spYaw:1.17, chYaw:0.875,
  armC:13, armA:38, armLag:-0.2, elb:88, elbA:10, abd:10, headPitch:-4 };

function gaitFoot(G, t, side){
  var off = side==='R'?0:0.5, x = t/G.T+off, c = Math.floor(x), ph = x-c;
  var fx = (side==='L'?1:-1)*G.footX, Lhb = B.heel+B.ball;
  function stance(cyc,u){
    var Hz = (cyc-off)*G.S + G.zS, p, q;
    if (u < G.ur1){ var r=1-u/G.ur1; p=G.th*r*r; q=footQ(0,p); return { a:sub([fx,0,Hz], qrot(q,FOOT_HEEL)), p:p, c:'heel' }; }
    if (u <= G.ur2) return { a:[fx,B.ankH,Hz+B.heel], p:0, c:'flat' };
    var w=(u-G.ur2)/(1-G.ur2); p=-G.tt*w*w; q=footQ(0,p);
    return { a:sub([fx,0,Hz+Lhb], qrot(q,FOOT_BALL)), p:p, c:'ball' };
  }
  if (ph < G.d){ var st = stance(c, ph/G.d); st.stance = true; return st; }
  var s = (ph-G.d)/(1-G.d), e = 1e-4, k = (1-G.d)/G.d/e;
  var A0 = stance(c,1), A0b = stance(c,1-e), A1 = stance(c+1,0), A1b = stance(c+1,e);
  var h00=2*s*s*s-3*s*s+1, h10=s*s*s-2*s*s+s, h01=-2*s*s*s+3*s*s, h11=s*s*s-s*s;
  function H(p0,p0b,p1,p1b){ return h00*p0 + h10*(p0-p0b)*k + h01*p1 + h11*(p1b-p1)*k; }
  var a = [ fx, H(A0.a[1],A0b.a[1],A1.a[1],A1b.a[1]), H(A0.a[2],A0b.a[2],A1.a[2],A1b.a[2]) ];
  a[1] += G.lift*28.94*s*s*(1-s)*(1-s)*(1-s);   // clearance bump: zero slope at toe-off AND heel strike, peak = lift at s=0.4
  return { a:a, p:H(A0.p,A0b.p,A1.p,A1b.p), c:null, stance:false, sw:s };
}

function solveLeg(p, S, a, q, stance){
  var r = legIK(p, S, a, q);
  if (!stance){ var ae = qToEul(p.q['ankle'+S]), ac = clampJoint('ankle'+S, ae);   // swing foot: keep the ankle inside its range
    if (ac[0]!==ae[0]||ac[1]!==ae[1]||ac[2]!==ae[2]) p.q['ankle'+S] = eul(ac[0],ac[1],ac[2]); }
  return r;
}

function gaitPose(G, t){
  var p = newPose(), ph = frac(t/G.T), w = TAU*ph, v = G.S/G.T;
  var yaw = G.yaw*Math.cos(w), tilt = -G.tilt*Math.sin(w-TAU*G.swayPh);
  p.root = [ -G.sway*Math.sin(w-TAU*G.swayPh), G.h - G.bob*Math.cos(2*(w-TAU*G.bobPh)), 0 ];
  p.q.pelvis = eul(G.lean, yaw, tilt);
  p.q.spine  = eul(G.spLean, -yaw*G.spYaw, -tilt*0.6);
  p.q.chest  = eul(G.chLean, -yaw*G.chYaw, -tilt*0.3);
  var aw = w - TAU*G.armLag;
  p.se = {};
  [['R',-Math.cos(aw),-1],['L',Math.cos(aw),1]].forEach(function(A){
    var f=A[1], s=A[2];
    p.se['shoulder'+A[0]] = [-(G.armC+G.armA*f), s*-6, s*G.abd];
    p.q['shoulder'+A[0]] = eul(-(G.armC+G.armA*f), s*-6, s*G.abd);
