; fixture for tools/validate_data.py (PACK_SPEC section 5): preset.0 excludes packs/* (after another pattern) and
; passes; preset.1 has an empty exclude_filter, so a private figure pack under res://packs/ would ship: it must fail.
[preset.0]

name="Desktop sample"
platform="Windows Desktop"
export_filter="all_resources"
include_filter="assets/kits/kits.json"
exclude_filter="docs/*, packs/*"
export_path="../dist-godot/sample/Sample.exe"

[preset.0.options]

application/product_name="Sample"

[preset.1]

