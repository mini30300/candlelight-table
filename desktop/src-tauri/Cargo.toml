[package]
name = "candlelight-table"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Candlelight Table — โต๊ะ D&D ที่มี Claude เป็นผู้คุมเกม"
authors = ["mini30300"]
license = "MIT"

# ชื่อไฟล์ .exe ที่ได้ออกมา
[[bin]]
name = "candlelight-table"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"     # ตัวเล็กสำคัญกว่าเร็ว หน้าเว็บเป็นคนทำงานจริง
lto = true
codegen-units = 1
panic = "abort"
strip = true
