name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  # A pull request only gets compiled. It never touches the signing secrets and never cuts a release,
  # so the release build below stays exactly as it was: pushes to main and manual runs.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /home/runner/candlelight.jks
      - run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: /home/runner/candlelight.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - uses: actions/upload-artifact@v4
        with:
          name: candlelight-table-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Candlelight Table build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
